<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>نظام متابعة نظافة المواقع</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js" defer></script>
<style>
:root{
  --bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--line2:#eef1f5;--tx:#16202c;--mut:#6a7686;
  --nav:#0f2742;--pri:#0e6f7a;--pri2:#0b5961;--pril:#e3f2f3;
  --ok:#1a7f4b;--okl:#e6f4ec;--wa:#a86412;--wal:#fdf2e2;--da:#b42f2f;--dal:#fbeaea;--inf:#2d5bb5;--infl:#e8eefa;
  --r:12px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14.5px;line-height:1.6}
body{min-height:100vh;padding-bottom:84px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;font-size:16px;color:var(--tx);background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri);box-shadow:0 0 0 3px #0e6f7a1f}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:10px;height:58px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand .lg img{width:28px;height:auto;display:block}
/* شعار الشركة متحرّكاً: القوسان يبدآن متباعدين ثم يقتربان حتى يلتئما مع بقية الشعار */
.logo{position:relative;width:180px;aspect-ratio:360/241;margin:0 auto}
.logo img{position:absolute;inset:0;width:100%;height:100%}
.logo.anim .c{animation:lgC .7s cubic-bezier(.2,.8,.2,1) both}
.logo.anim .l{animation:lgL 1s .15s cubic-bezier(.16,.9,.2,1) both}
.logo.anim .r{animation:lgR 1s .15s cubic-bezier(.16,.9,.2,1) both}
@keyframes lgC{from{opacity:0;transform:scale(.82)}to{opacity:1;transform:none}}
@keyframes lgL{from{opacity:0;transform:translateX(-60%)}60%{opacity:1}to{opacity:1;transform:none}}
@keyframes lgR{from{opacity:0;transform:translateX(60%)}60%{opacity:1}to{opacity:1;transform:none}}
#splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:radial-gradient(circle at 50% 40%,#173a60,var(--nav) 70%);color:#fff;transition:opacity .45s ease}
#splash.out{opacity:0;pointer-events:none}
#splash .nm{text-align:center;margin-top:18px;animation:lgT .6s .95s ease both}
#splash .nm b{display:block;font-size:20px}#splash .nm small{opacity:.7;font-size:13px}
@keyframes lgT{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.login .logo{width:120px;margin:4px auto 14px}
.login .logo-bg{background:var(--nav);border-radius:var(--r);padding:16px 0 12px;margin-bottom:12px}
@media (prefers-reduced-motion:reduce){.logo.anim img,#splash .nm{animation:none}}
.brand .lg{width:34px;height:34px;border-radius:9px;background:#ffffff1a;display:grid;place-items:center}
.brand b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11.5px;opacity:.7;margin-top:-3px}
.sp{flex:1}
.hbtn{height:36px;padding:0 10px;border-radius:9px;background:#ffffff14;color:#fff;display:inline-flex;align-items:center;gap:6px;font-size:13px}
.mode{font-size:11px;padding:2px 8px;border-radius:20px;background:#ffffff1a;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}
.card h3{margin:0 0 10px;font-size:15px;font-weight:700;display:flex;align-items:center;gap:8px}
.ttl{display:flex;align-items:center;gap:8px;margin:16px 0 4px}
.ttl h2{margin:0;font-size:18px}
.mut{color:var(--mut)} .sm{font-size:12.5px} .xs{font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;padding:10px 14px;border-radius:10px;font-weight:600;background:#fff;border:1px solid var(--line)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:active{background:var(--pri2)}
.btn.dan{color:var(--da);border-color:#e8bcbc}
.btn.big{width:100%;padding:13px;font-size:15.5px}
.btn.w{width:100%}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.45}
.row{display:flex;gap:10px;align-items:center}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g4{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:620px){.g4{grid-template-columns:repeat(4,1fr)}}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:12px}
.kpi .v{font-size:22px;font-weight:700;line-height:1.3}
.kpi .l{font-size:12px;color:var(--mut)}
.bar{height:6px;border-radius:6px;background:var(--line2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--pri);border-radius:6px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:760px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:11px;color:var(--mut);padding:6px 0;font-weight:500}
nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs .mid span.c{width:46px;height:46px;border-radius:14px;background:var(--pri);color:#fff;display:grid;place-items:center;margin-top:-20px;box-shadow:0 4px 14px #0e6f7a55}
.zr{display:flex;align-items:center;gap:10px;padding:11px 12px;border-bottom:1px solid var(--line2);width:100%;text-align:right;background:#fff}
.zr:last-child{border-bottom:0}
.zr .dot{width:10px;height:10px;border-radius:50%;flex:none}
.zr .nm{font-weight:600}
.list{background:#fff;border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin:10px 0}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.t-ok{background:var(--okl);color:var(--ok)} .t-wa{background:var(--wal);color:var(--wa)} .t-da{background:var(--dal);color:var(--da)} .t-inf{background:var(--infl);color:var(--inf)} .t-pri{background:var(--pril);color:var(--pri)}
.d-ok{background:var(--ok)} .d-wa{background:#d99a2b} .d-da{background:var(--da)}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}
.filters select,.filters input{flex:1;min-width:130px;padding:8px 10px;font-size:14px}
.seg{display:flex;background:#e9edf2;border-radius:10px;padding:3px;gap:3px;overflow-x:auto}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut);white-space:nowrap}
.seg button.on{background:#fff;color:var(--tx);box-shadow:0 1px 3px #0001}
.steps{display:flex;gap:4px;margin:8px 0}
.steps div{flex:1;text-align:center;font-size:11px;color:var(--mut)}
.steps div i{display:block;height:4px;border-radius:4px;background:var(--line);margin-bottom:4px}
.steps div.on{color:var(--pri);font-weight:600} .steps div.on i{background:var(--pri)}
.shot{position:relative;border-radius:var(--r);overflow:hidden;background:#111;border:1px solid var(--line)}
.shot canvas{display:block;width:100%;height:auto}
.shot .lbl{position:absolute;top:8px;right:8px;background:#000000b0;color:#fff;padding:2px 9px;border-radius:6px;font-size:12px}
.scanl{position:absolute;left:0;right:0;height:2px;background:#4fd1c5;box-shadow:0 0 12px 3px #4fd1c588;animation:scan 1.1s ease-in-out infinite alternate;top:0}
@keyframes scan{to{top:calc(100% - 2px)}}
.live{position:relative;border-radius:var(--r);overflow:hidden;background:#000;border:1px solid var(--line)}
.live video{display:block;width:100%;height:auto;max-height:62vh;object-fit:contain;margin:0 auto}
.live canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.lv-st{position:absolute;top:8px;right:8px;left:8px;display:flex;justify-content:space-between;gap:6px;pointer-events:none}
.lv-st span{background:#000000b8;color:#fff;padding:3px 10px;border-radius:7px;font-size:13px}
.lv-st .ok{background:#0f7a55e6}.lv-st .wa{background:#a8650ee6}
.gwhole{position:relative;width:min(100%,260px);margin:0 auto;border-radius:10px;overflow:hidden;background:#000}
.gwhole img{display:block;width:100%;height:auto}
.gbox{position:absolute;border:3px solid #2ad48f;border-radius:6px;box-shadow:0 0 0 999px rgba(0,0,0,.55);transition:all .5s ease}
.gref{display:block;width:100%;border-radius:10px}
.gdots{display:flex;gap:6px;justify-content:center;margin:8px 0}.gdots i{width:9px;height:9px;border-radius:50%;background:var(--line)}.gdots i.on{background:var(--pri)}.gdots i.cur{background:#2ad48f}
.gres{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}.gres div{position:relative}.gres img{width:100%;border-radius:8px;display:block}.gres span{position:absolute;bottom:4px;right:4px;background:#000c;color:#fff;font-size:11px;padding:1px 6px;border-radius:5px}
.refcv{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;border-radius:10px}
.analyzing{height:220px;display:grid;place-items:center;color:#cfe;position:relative;overflow:hidden;background:#0d1b26}
.idx{display:flex;align-items:center;gap:14px}
.idx .n{font-size:34px;font-weight:700;line-height:1}
.note{background:var(--infl);border:1px solid #cbd8f2;border-radius:10px;padding:10px 12px;font-size:13px}
.note.wa{background:var(--wal);border-color:#f0d6ad}
.note ul{margin:4px 0 0;padding-inline-start:18px}
.timer{font-size:46px;font-weight:700;text-align:center;font-variant-numeric:tabular-nums}
.cmp{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pl{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line2);font-size:13.5px}
.total{font-size:36px;font-weight:700;color:var(--pri);text-align:center}
.ach{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.ach{grid-template-columns:repeat(3,1fr)}}
.ach div{display:flex;gap:8px;align-items:center;padding:9px;border:1px solid var(--line);border-radius:10px;font-size:12.5px}
.ach div svg{color:var(--pri)}
.ach div.lock{opacity:.4}
.ach div.lock svg{color:var(--mut)}
.lb{display:flex;align-items:center;gap:10px;padding:10px 12px;border-bottom:1px solid var(--line2)}
.lb.me{background:var(--pril)}
.lb .rk{width:28px;text-align:center;font-weight:700;color:var(--mut)}
.lb .rk.t{color:var(--pri)}
.av{width:34px;height:34px;border-radius:50%;background:var(--pril);color:var(--pri);display:grid;place-items:center;font-weight:700;font-size:13px;flex:none}
.modal-bg{position:fixed;inset:0;background:#0b1520a0;z-index:50;display:flex;align-items:flex-end;justify-content:center}
@media(min-width:620px){.modal-bg{align-items:center}.modal{border-radius:14px!important}}
.modal{background:#fff;border-radius:16px 16px 0 0;width:100%;max-width:560px;max-height:90vh;overflow:auto;padding:18px 16px calc(18px + env(safe-area-inset-bottom))}
.modal h2{margin:0 0 12px;font-size:17px}
.fld{margin:10px 0} .fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:4px;font-weight:600}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:80;background:var(--nav);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;box-shadow:0 8px 24px #0003;max-width:90vw;text-align:center}
.empty{text-align:center;padding:24px 12px;color:var(--mut)}
.login{max-width:420px;margin:30px auto}
.label-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:620px){.label-grid{grid-template-columns:repeat(3,1fr)}}
.lblc{border:1px dashed #9aa6b5;border-radius:8px;padding:10px;text-align:center;background:#fff}
.lblc .qr{display:flex;justify-content:center;margin:6px 0}
.lblc .cd{font-size:22px;font-weight:700;letter-spacing:3px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{padding:8px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}
th{color:var(--mut);font-weight:600;background:#f8fafc}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.thumbs{display:flex;gap:4px} .thumbs img{width:76px;height:57px;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.loading{display:grid;place-items:center;height:60vh;text-align:center;color:var(--mut)}
.spin{width:34px;height:34px;border-radius:50%;border:3px solid var(--line);border-top-color:var(--pri);animation:sp 1s linear infinite;margin:0 auto 10px}
@keyframes sp{to{transform:rotate(360deg)}}
.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.tg:last-child{border:0}
.sw{width:44px;height:24px;border-radius:20px;background:#cfd6df;position:relative;flex:none}
.sw.on{background:var(--pri)}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{right:23px}
.prog{height:8px;background:var(--line2);border-radius:8px;overflow:hidden;margin:10px 0}
.prog i{display:block;height:100%;background:var(--pri);transition:width .2s}
.ok-anim{width:64px;height:64px;border-radius:50%;background:var(--okl);color:var(--ok);display:grid;place-items:center;margin:0 auto 6px;animation:pop .4s ease-out}
.ok-anim svg{width:34px;height:34px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.mission:last-child{border:0}
.mission .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid #c3ccd7;display:grid;place-items:center;flex:none}
.mission.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.mission.done .ck svg{width:14px;height:14px;stroke-width:3}
.mission.done .t{color:var(--mut)}
</style>
</head>

/* ================= محرك كشف الغبار (الإصدار 2) =================
   المشكلة في الإصدار الأول: حبكة القماش ونقوش السطح والخلفية تُقرأ كغبار.
   1) التحليل على منطقة يحددها الموظف (السطح فقط) وبدقة أعلى (حتى 900px للمنطقة).
   2) فتح مورفولوجي بعناصر خطية في 4 اتجاهات: الحبيبة تختفي في كل الاتجاهات، أما الخيوط
      والحواف والنقوش فتبقى في اتجاه واحد على الأقل، فتُستبعد تلقائياً.

   4) مرشحات شكل (حجم، استطالة) ولون (الغبار رمادي محايد) واستبعاد اللمعان والمناطق المحترقة.
   5) يعمل داخل Web Worker حتى لا تتجمد الواجهة، مع بديل على الخيط الرئيسي. */
function analyzeDust(px, w, h, sens, opt){
  sens = sens || 1; opt = opt || {};
  const N = w * h, L = new Float32Array(N), C = new Float32Array(N);
  for(let i = 0, j = 0; i < N; i++, j += 4){

  // جودة الصورة
  let sum = 0; for(let i = 0; i < N; i++) sum += L[i];

  const sharp = lc ? ls2 / lc - (ls / lc) ** 2 : 0;

  //    الحبيبة أصغر من العنصر في كل الاتجاهات فتختفي في كل فتح ⇒ تظهر في min.
  //    الخيوط والحواف والنقوش الطولية تبقى في اتجاه واحد على الأقل ⇒ min≈0.

        else { for(let k = 1, o = st; k <= R; k++, o += st){ const a = src[i + o], b = src[i - o]; if(a < m) m = a; if(b < m) m = b; } }

function spanMin(a, b){ const c = cutMin(); let f = tmin(a), to = tmin(b); if(f < c) f += 1440; if(to < c || to <= f) to += 1440; return to > f ? [f, to] : null; }

  const out = [];

/* ----- دوام الموظفين: يختلف من موظف لآخر ومن يوم لآخر -----

/* ----- المفتش العام: عيّنة يومية عشوائية (20% افتراضياً) من كل مواقع الشركة للفحص الميداني ----- */
function hash32(t){ let h = 2166136261; for(let i = 0; i < t.length; i++){ h ^= t.charCodeAt(i); h = Math.imul(h, 16777619); } return h >>> 0; }
// العيّنة ثابتة طوال اليوم (مشتقة من التاريخ) فلا تتغيّر بإعادة الفتح، وتختلف كل يوم
function inspSample(day = dayKey()){
  const n = Math.ceil(S.zones.length * (+cfg('inspRate') || 20) / 100);
  return S.zones.slice().sort((a, b) => hash32(day + '|' + a.id) - hash32(day + '|' + b.id)).slice(0, n)
    .sort((a, b) => (a.section || '').localeCompare(b.section || '', 'ar') || zNum(a).localeCompare(zNum(b), 'en', { numeric: true }));
}
function inspView(full){

  let h = `<div class="g4" style="grid-template-columns:repeat(3,1fr)"><div class="kpi"><div class="l">عيّنة اليوم</div><div class="v">${L.length}</div></div>

    <div class="note">يُختار يومياً ${cfg('inspRate')}% من مواقع الشركة عشوائياً. افحص كل موقع ميدانياً ثم أكّد النتيجة. «غير مطابق» يخصم ${cfg('inspPen')} نقاط ممن نظّفه اليوم ويُدرج الموقع كبلاغ عاجل.</div>`;
  h += L.length ? `<div class="list">${L.map(z => { const r = it[z.id], zs = zoneState(z);
    return `<button class="zr" data-act="${full ? 'inspOpen' : 'inspOpen'}" data-id="${esc(z.id)}"><span class="dot d-${r ? (r.r === 'ok' ? 'ok' : 'da') : 'wa'}"></span><div style="flex:1;min-width:0"><div class="row" style="justify-content:space-between;gap:6px"><span class="nm">${esc(zTitle(z))}</span>${r ? (r.r === 'ok' ? '<span class="tag t-ok">مطابق</span>' : '<span class="tag t-da">غير مطابق</span>') : '<span class="tag t-wa">لم يُفحص</span>'}</div>
      <div class="xs mut">${esc(z.section || '')}${z.branch ? ' · ' + esc(z.branch) : ''} · ${zs.done}/${zs.tot} جولات اليوم · ${ago(z.lastClean)}${r && r.note ? ' · ' + esc(r.note) : ''}</div></div></button>`; }).join('')}</div>` : '<div class="card empty">لا توجد مواقع مسجّلة.</div>';
  return h;

async function inspSave(zid, res){
  const z = zoneById(zid); if(!z) return;
  if(needCode()){ toast('امسح باركود الموقع لتأكيد وجودك.'); const raw = await scanBarcode(); if(raw == null) return; if(codeFrom(raw) !== zNum(z)) return toast('الباركود لا يطابق هذا الموقع.'); }
  const day = dayKey(), ts = Date.now(), t0 = dayStart(), note = (($('#inN') || {}).value || '').trim();
  const cl = [...new Set(zEls(z).map(e => (z.lc || {})[e.k]).filter(lc => lc && lc.t >= t0).map(lc => lc.by))];
  const item = { r: res, by: S.me || 'admin', ts, note, cl: cl.join(','), th: S.inspTh || '' };
  const cur = (S.insp && S.insp.day === day ? S.insp.it : null) || {};
  if(!(await Store.set('insp', day, { day, it: Object.assign({}, cur, { [zid]: item }) }))) return;
  S.inspTh = '';
  if(res === 'bad'){
    const pen = +cfg('inspPen') || 0, ym = ymOf(ts);
    for(const id of cl){
      const sm = S.sums.find(x => x.staff === id && x.ym === ym), st = staffById(id);
      if(sm && pen) await Store.update('sum', sm.id, { pts: Math.max(0, (sm.pts || 0) - pen), insp: (sm.insp || 0) + 1 });
      if(st && pen) await Store.update('staff', st.id, { st: { life: Math.max(0, ((st.st || {}).life || 0) - pen) } });
    }
    await Store.update('zones', zid, { flaggedAt: ts, flaggedBy: S.me || 'admin' });
  }
  closeModal(); tone(res === 'ok'); toast(res === 'ok' ? 'سُجّل: مطابق.' : 'سُجّل: غير مطابق' + (cl.length ? '، وخُصمت النقاط' : '') + '، وأُدرج الموقع كبلاغ.');
}

function newFlow(mode, zid, el, rlabel){ F = { mode, step: 'zone', startT: Date.now(), el: el || '', rlabel: rlabel || '', f: { q: '', st: '', mine: true, lim: 30 } }; if(zid) pickZone(zid, false); }
function pickZone(id, codeOk){ const z = zoneById(id); if(!z) return; F.zoneId = id; F.wasFlag = zoneState(z).flagged; if(needCode() && !codeOk){ F.step = 'code'; return; } flowAfterZone(); }

function flowAfterZone(){
  const z = zoneById(F.zoneId), els = zEls(z);
  if(!F.el){ if(els.length === 1) F.el = els[0].k; else { F.step = 'el'; return; } }
  const el = els.find(e => e.k === F.el) || els[0]; F.el = el.k;
  F.single = F.mode === 'clean' && cfg('flow') !== 'pair';
  if(F.mode === 'clean'){
    const rs = roundsOf(el).filter(r => r.t === 'c'), st = rs.map(r => roundSt(z, el, r));
    F.onTime = st.includes('now'); F.wasDue = st.includes('late');
    F.extra = !F.wasFlag && !st.some(x => x === 'now' || x === 'late');
    if(F.extra && !catOf(el.c).extra){
      const nx = rs.find((r, i) => st[i] === 'soon');
      F.step = 'blocked'; F.blockMsg = nx ? `الجولة التالية لـ«${el.k}» تبدأ الساعة ${hm(nx.f)}. التنظيف قبلها لا يُحتسب.` : `أُنجز تنظيف «${el.k}» لهذا اليوم، وفئته (${el.c}) لا تسمح بتنظيف إضافي.`;
      return;
    }
  }
  F.step = F.mode === 'scan' ? 'before' : F.single ? 'after' : 'before';
  // موقع له مرجع معتمد ← تصوير موجّه رفاً رفاً
  if(F.single && z.ref && z.ref.ok && z.ref.n){ F.step = 'gLoad'; F.guide = null; F.guideRes = null; setTimeout(loadGuide, 0); }
}

function anCard(key, an, v){
  return `<div class="shot"><canvas data-ov="${key}"></canvas><span class="lbl">${an.v === 2 ? `${an.n} حبيبة · ${an.zonesDusty} منطقة من ${an.cellsValid}` : `${an.zonesDusty} منطقة غبار من ${an.GX * an.GY}`}</span></div>
    <label class="row sm" style="margin:6px 0"><input type="checkbox" style="width:auto" data-act="toggleDetail" ${S.detail ? 'checked' : ''}> إظهار الحبيبات المكتشفة</label>
    <div class="card idx"><div><div class="xs mut">مؤشر الغبار</div><div class="n" style="color:${v.c}">${an.idx}</div></div><div style="flex:1"><span class="tag ${v.k}" style="font-size:13px">${v.t}</span>
    <div class="bar" style="margin-top:8px"><i style="width:${an.idx}%;background:${v.c}"></i></div><div class="xs mut" style="margin-top:4px">المناطق المظلّلة تمثّل تركّز الغبار؛ الأحمر للتركّز العالي.</div></div></div>`;
}
function qualityBad(an){ const n = []; if(an.mean < 40) n.push('الصورة مظلمة.'); if(an.mean > 238) n.push('الإضاءة زائدة.'); if(an.sharp < 10) n.push('الصورة غير واضحة.'); return n.join(' '); }

/* ----- قراءة الباركود من صورة: BarcodeDetector إن توفر (أندرويد)، وإلا مكتبة ZXing (تعمل على iPhone) ----- */
const codeFrom = raw => { const t = String(raw || '').trim(), m = t.match(/(\d+)\s*$/) || t.match(/(\d+)/); return m ? m[1] : t; };
async function scanBarcode(){
  const f = await pickPhoto(); if(!f) return null;
  let img; try{ img = await loadImg(f); }catch(e){ toast('تعذّرت قراءة الصورة.'); return null; }
  if('BarcodeDetector' in window){ try{ const r = await new BarcodeDetector().detect(img); if(r.length) return r[0].rawValue; }catch(e){} }
  try{
    if(!window.ZXing){ toast('جارٍ تحميل قارئ الباركود…'); await loadScript('https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js'); }
    const iw = img.naturalWidth, ih = img.naturalHeight;
    const rd = new ZXing.MultiFormatReader(); rd.setHints(new Map([[ZXing.DecodeHintType.TRY_HARDER, true]]));
    // الباركود الخطي لا يُقرأ إلا أفقياً: نجرّب الصورة كما هي ثم مدوّرة 90° وبحجمين
    for(const mx of [1600, 900]) for(const rot of [0, 1]){
      const k = Math.min(1, mx / Math.max(iw, ih)), w = Math.round(iw * k), h = Math.round(ih * k), c = document.createElement('canvas');
      c.width = rot ? h : w; c.height = rot ? w : h; const x = c.getContext('2d'); if(rot){ x.translate(h, 0); x.rotate(Math.PI / 2); } x.drawImage(img, 0, 0, w, h);
      try{ return rd.decode(new ZXing.BinaryBitmap(new ZXing.HybridBinarizer(new ZXing.HTMLCanvasElementLuminanceSource(c)))).getText(); }catch(e){}
    }
    toast('لم يُقرأ الباركود. قرّب الكاميرا واجعله واضحاً وسط الصورة.', 3800);
  }catch(e){ toast('تعذّر تحميل قارئ الباركود (يحتاج اتصالاً بالإنترنت). اكتب رقم الموقع.', 4200); }
  return null;
}
function pickPhoto(){
  return new Promise(res => { const i = document.createElement('input'); i.type = 'file'; i.accept = 'image/*'; i.setAttribute('capture', 'environment'); i.style.display = 'none';
    i.onchange = () => { const f = i.files && i.files[0]; i.remove(); res(f || null); }; document.body.appendChild(i); i.click(); });
}
async function shoot(which){
  const f = await pickPhoto(); if(!f) return;
  try{
    const img = await loadImg(f), p = prep(img);
    const prev = which === 'after' && F.before && F.before.rect;
    F.pick = { which, img, p, rect: prev ? { ...prev } : { x: 0.15, y: 0.15, w: 0.7, h: 0.7 } };
    F.step = which; rf(); window.scrollTo({ top: 0, behavior: 'smooth' });
  }catch(e){ toast('تعذّرت قراءة الصورة. حاول مرة أخرى.'); }
}
// تحديد منطقة التحليل بالسحب على الصورة
function roiInit(){
  const cv = $('#roiCv'); if(!cv || cv._on) return; cv._on = 1;
  const pk = F.pick; drawOverlay(cv, pk.p.canvas, null, false, pk.rect);
  let st = null;
  const pt = e => { const b = cv.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - b.left) / b.width)), Math.max(0, Math.min(1, (e.clientY - b.top) / b.height))]; };
  cv.addEventListener('pointerdown', e => { st = pt(e); cv.setPointerCapture(e.pointerId); e.preventDefault(); });
  cv.addEventListener('pointermove', e => { if(!st) return; const q = pt(e);
    const r = { x: Math.min(st[0], q[0]), y: Math.min(st[1], q[1]), w: Math.abs(q[0] - st[0]), h: Math.abs(q[1] - st[1]) };
    if(r.w > 0.04 && r.h > 0.04){ pk.rect = r; drawOverlay(cv, pk.p.canvas, null, false, r); } });
  const end = () => { st = null; }; cv.addEventListener('pointerup', end); cv.addEventListener('pointercancel', end);
}
async function analyzePick(){
  const pk = F.pick; if(!pk) return;
  const iw = pk.img.naturalWidth || pk.img.width, ih = pk.img.naturalHeight || pk.img.height;
  if(pk.rect.w * iw < 120 || pk.rect.h * ih < 120) return toast('المنطقة المحددة صغيرة جداً. اسحب لتحديد منطقة أكبر.');
  F.pick = null; await finishShot(pk.which, pk.img, pk.p, pk.rect, false);
}
async function finishShot(which, img, p, rect, live){
  F.busy = true; F.step = which; rf();
  try{
    const an = await analyzeRegion(img, rect, cfg('sens') || 1, DUST_MAX, { d0: zoneD0(zoneById(F.zoneId)), h0: zoneH0(zoneById(F.zoneId)) }); await sleep(300);
    F[which] = { an, canvas: p.canvas, rect, thumb: thumbRect(p.canvas, rect), sig: signature(p.g, p.w, p.h), t: Date.now(), live: !!live };
    F.busy = false;
    if(which === 'before') F.step = F.mode === 'scan' ? 'scanRes' : 'beforeRes';
    else { compute(); F.step = 'result'; }
    tone(which === 'before' || F.res.pass); rf(); window.scrollTo({ top: 0, behavior: 'smooth' });
    if(F.step === 'result' && F.res.pass && !F.res.single) saveClean(false);
  }catch(e){ F.busy = false; rf(); toast('تعذّر تحليل الصورة. حاول مرة أخرى.'); }
}
/* ================= الصور المرجعية لكل موقع =================
   مرجع الموقع: صورة كاملة للعارضة + خطوات (رفوف) محددة عليها، ولكل خطوة صورة قريبة وهي نظيفة.
   تُستخدم للتوجيه (حركة من العارضة إلى الرف + صورة شفافة فوق الكاميرا + التقاط تلقائي عند التطابق)
   وللمعايرة الخاصة بكل رف: خط الأساس d0 = كثافة الحبيبات في صورته النظيفة.
   التخزين: مجموعة ref في Firebase، أو IndexedDB في الوضع المحلي (الصور أكبر من سعة localStorage). */
const REF_RECT = { x: 0.05, y: 0.05, w: 0.9, h: 0.9 }, FULL = { x: 0, y: 0, w: 1, h: 1 };
const RefStore = {
  _db: null, cache: {},
  _idb(){ if(!this._db) this._db = new Promise((res, rej) => { try{ const r = indexedDB.open('dh2_refs', 1); r.onupgradeneeded = () => r.result.createObjectStore('ref'); r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error); }catch(e){ rej(e); } }); return this._db; },
  async get(zid){
    if(zid in this.cache) return this.cache[zid];
    let d = null;
    try{
      if(Store.fb || Store.db) d = await Store.getDoc('ref', zid);
      else { const db = await this._idb(); d = await new Promise((res, rej) => { const q = db.transaction('ref').objectStore('ref').get(zid); q.onsuccess = () => res(q.result || null); q.onerror = () => rej(q.error); }); }
    }catch(e){ d = null; }
    return this.cache[zid] = d;
  },
  async put(zid, d){
    this.cache[zid] = d;
    if(Store.fb || Store.db) return Store.set('ref', zid, d);
    try{ const db = await this._idb(); await new Promise((res, rej) => { const t = db.transaction('ref', 'readwrite'); t.objectStore('ref').put(d, zid); t.oncomplete = res; t.onerror = () => rej(t.error); }); return true; }
    catch(e){ toast('تعذّر حفظ الصورة المرجعية على هذا الجهاز.'); return false; }
  },
  async del(zid){ delete this.cache[zid]; if(Store.fb || Store.db) return Store.del('ref', zid); try{ const db = await this._idb(); db.transaction('ref', 'readwrite').objectStore('ref').delete(zid); }catch(e){} return true; }
};

const GUIDE = { x: 0.1, y: 0.14, w: 0.8, h: 0.66 };

    if(LIVE.canTorch && cfg('autoTorch')){ try{ await tr.applyConstraints({ advanced: [{ torch: true }] }); LIVE.torch = true; }catch(e){} }

function liveQuality(v){
  const x = _mc.getContext('2d', { willReadFrequently: true });

// صورة واحدة بعد التنظيف: التقييم المبدئي من المؤشر. المؤشر المرتفع لا يرفض العملية بل يعلّق نقاطها حتى يحكم المدقق
function computeSingle(){
  const a = F.after.an.idx, pass = a <= 35;
  const R = { a, b: null, red: 0, sim: 1, dur: 0, pass, perfect: pass && a < 15, lines: [], total: 0, single: true, extra: !!F.extra };
  R.lines.push([F.extra ? 'تنظيف إضافي' : 'إنجاز التنظيف', 10]);
  const q = Math.round(Math.max(0, 35 - a) / 35 * 10); if(q) R.lines.push(['جودة النتيجة (المؤشر ' + a + ')', q]);
  if(F.wasFlag) R.lines.push(['معالجة موقع مُبلَّغ عنه', 15]); else if(F.onTime) R.lines.push(['في موعد الجولة', 3]);
  if(R.perfect) R.lines.push(['نتيجة ممتازة', 5]);
  const base = R.lines.reduce((x, l) => x + (typeof l[1] === 'number' ? l[1] : 0), 0);
  const st = (me() || {}).st || {}, prev = streakNow(st), stk = st.lastDay === dayKey() ? prev : prev + 1, mult = 1 + Math.min(Math.max(stk - 1, 0), 10) * 0.03;
  if(mult > 1) R.lines.push(['مضاعف الالتزام (' + stk + ' أيام)', '×' + mult.toFixed(2)]);
  if(F.extra) R.lines.push(['تنظيف إضافي', '×0.5']);
  const why = []; if(!pass) why.push('التقييم المبدئي مرتفع (' + a + ')'); if(F.manual) why.push('رقم الموقع أُدخل يدوياً');
  if(F.guideRes && F.guideRes.some(g => g.al != null && g.al < 0.35)) why.push('لقطة لا تطابق الصورة المرجعية');
  R.sus = why.length > 0; R.susWhy = why.join('، ');
  R.total = Math.max(1, Math.round(base * mult * (F.extra ? 0.5 : 1)));
  if(!pass){ R.held = R.total; R.lines.push(['معلّقة حتى اعتماد المدقق', '']); }
  F.res = R;
}
function compute(){
  if(!F.before || F.single){ computeSingle(); return; }
  const z = zoneById(F.zoneId) || {}, b = F.before.an.idx, a = F.after.an.idx;
  const red = b > 0 ? Math.max(0, (b - a) / b) : 0, sim = corr(F.before.sig, F.after.sig), dur = (F.after.t - F.before.t) / 1000;
  const pass = a <= 35 || (red >= 0.4 && a <= 55);
  const R = { a, b, red, sim, dur, pass, perfect: pass && a < 15, lines: [], total: 0 };
  if(pass){
    R.lines.push(['إنجاز عملية التنظيف', 10]);
    const q = Math.round(red * 10); if(q) R.lines.push(['جودة الإزالة (' + Math.round(red * 100) + '%)', q]);
    if(F.wasDue) R.lines.push([F.wasFlag ? 'معالجة موقع مُبلَّغ عنه' : 'معالجة موقع متأخر', F.wasFlag ? 15 : 10]);
    if(R.perfect) R.lines.push(['نتيجة ممتازة', 5]);
    const base = R.lines.reduce((x, l) => x + l[1], 0);
    const st = (me() || {}).st || {}, prev = streakNow(st), stk = st.lastDay === dayKey() ? prev : prev + 1;
    const mult = 1 + Math.min(Math.max(stk - 1, 0), 10) * 0.03;
    if(mult > 1) R.lines.push(['مضاعف الالتزام (' + stk + ' أيام)', '×' + mult.toFixed(2)]);
    const recent = z.lastClean && (F.startT - z.lastClean) < (z.interval || 24) * HOUR * 0.25 && !F.wasFlag;
    if(recent) R.lines.push(['الموقع نُظّف مؤخراً', '×0.3']);
    const why = []; if(sim < 0.45) why.push('عدم تطابق صورتي قبل وبعد'); if(dur < (cfg('minSec') || 0)) why.push('مدة أقل من الحد الأدنى');
    R.sus = why.length > 0; R.susWhy = why.join('، ');
    if(R.sus) R.lines.push(['قيد المراجعة', '×0.5']);

  } else { R.total = 2; R.lines.push(['محاولة غير مكتملة', 2]); }
  F.res = R;
}
// تسجيل عملية: يحدّث سجل الشهر + الملخص الشهري + بيانات الموظف + الموقع + (إثبات عند الحاجة)
async function record(type, R, extra = {}){
  const m = me(), z = zoneById(F.zoneId), ts = Date.now(), ym = ymOf(ts), d = dOf(ts), dk = dayKey(ts);
  if(!m || !z) return false;
  // المهام قبل وبعد
  const todayBefore = myTodayEntries(), misBefore = missions(todayBefore).every(x => x.done);
  const bits = (R.rescue ? 1 : 0) | (R.perfect ? 2 : 0) | (R.extra ? 4 : 0);
  const entry = [ts, z.id, type, R.b, R.a, R.pts, R.sus ? 1 : 0, bits, F.el || ''];
  const misAfter = !misBefore && missions(todayBefore.concat([entry])).every(x => x.done);
  const bonus = misAfter ? 15 : 0;
  // 1) سجل الشهر
  let act = S.myAct && S.myAct.ym === ym ? S.myAct : null;
  if(!act){ try{ act = await Store.getDoc('act', m.id + '_' + ym); }catch(e){ toast('تعذّر الاتصال. حاول مرة أخرى.'); return false; } act = act || { staff: m.id, ym, e: [] }; }
  const e2 = (act.e || []).concat([entry]); if(bonus) e2.push([ts + 1, z.id, 'm', 0, 0, bonus, 0, 0]);
  if(!(await Store.set('act', m.id + '_' + ym, { staff: m.id, ym, e: e2.slice(-1500) }))) return false;
  S.myAct = { id: m.id + '_' + ym, staff: m.id, ym, e: e2 };
  // 2) الملخص الشهري
  const s0 = Object.assign({ staff: m.id, ym, pts: 0, n: 0, fail: 0, res: 0, perf: 0, flag: 0, chk: 0, sus: 0, redSum: 0, dp: {}, dn: {}, mis: 0 }, mySum() || {});
  delete s0.id;
  const add = R.pts + bonus;
  s0.pts += add; s0.dp = Object.assign({}, s0.dp); s0.dp[d] = (s0.dp[d] || 0) + add;
  if(type === 'c'){ s0.n++; s0.redSum = Math.round((s0.redSum + R.red) * 100) / 100; s0.dn = Object.assign({}, s0.dn); s0.dn[d] = (s0.dn[d] || 0) + 1; if(R.rescue) s0.res++; if(R.perfect) s0.perf++; if(R.sus) s0.sus++; }
  if(type === 'x') s0.fail++; if(type === 'f') s0.flag++; if(type === 'k') s0.chk++; if(bonus) s0.mis++;
  s0.lastTs = ts;
  await Store.set('sum', m.id + '_' + ym, s0);
  // 3) بيانات الموظف التراكمية
  const st = Object.assign({}, m.st || {});
  st.life = (st.life || 0) + add;
  if(type !== 'f'){ const y = dayKey(ts - DAY); st.streak = st.lastDay === dk ? (st.streak || 1) : st.lastDay === y ? (st.streak || 0) + 1 : 1; st.lastDay = dk; st.bestStreak = Math.max(st.bestStreak || 0, st.streak); }
  if(type === 'c'){ st.lifeN = (st.lifeN || 0) + 1; if(R.rescue) st.lifeRes = (st.lifeRes || 0) + 1; if(R.perfect) st.lifePerf = (st.lifePerf || 0) + 1; if(R.red >= 0.85 && R.b >= 30) st.q85 = true; if(new Date(ts).getHours() < 10) st.early = true; st.maxDay = Math.max(st.maxDay || 0, s0.dn[d] || 0); }
  if(type === 'f') st.lifeFlag = (st.lifeFlag || 0) + 1; if(bonus) st.lifeMis = (st.lifeMis || 0) + 1;
  const achBefore = ACH.filter(a => a[2](m.st || {})).map(a => a[0]);
  await Store.update('staff', m.id, { st });
  F.newAch = ACH.filter(a => a[2](st) && !achBefore.includes(a[0]));
  if(bonus) toast('أكملت المهام اليومية: +15 نقطة');
  // 4) الموقع
  // سجل اليوم للعنصر (يحدد الجولات المنجزة) + آخر عملية لكل عنصر
  const zp = {}, ek = F.el;
  if(type === 'c' || type === 'k' || extra.resetZone){
    if(type === 'c' || extra.resetZone) Object.assign(zp, { lastClean: ts, lastBy: m.id, lastIdx: R.a, flaggedAt: 0 });
    if(ek){ zp.ops = { [ek]: elOps(z, ek).concat([type === 'k' && !extra.resetZone ? -ts : ts]) }; zp.lc = { [ek]: { t: ts, by: m.id, idx: R.a, ty: type } }; }

  if(Object.keys(zp).length) await Store.update('zones', z.id, zp);

  // 5) صورة للمدقق: كل العمليات حين تكون نسبة التدقيق 100% (الافتراضي)، وإلا المشكوك فيها والبلاغات وعيّنة عشوائية

    const one = F.after || F.before;
    await Store.set('proof', rid(), { ts, ym, staff: m.id, zone: z.id, zoneName: zTitle(z), section: z.section || '', branch: z.branch || '', type, el: F.el || '', round: F.rlabel || '', before: R.b ?? null, after: R.a,
      red: Math.round((R.red || 0) * 100), pts: R.pts, held: R.held || 0, sim: Math.round((R.sim ?? 1) * 100) / 100, sus: !!R.sus, why: R.susWhy || (type === 'f' ? 'بلاغ' : R.extra ? 'تنظيف إضافي' : 'تدقيق'), status: 'pending',
      thumbB: F.before && F.after ? F.before.thumb : '', thumbA: one ? one.thumb : '', live: !!(one && one.live), steps: F.guideRes || [] }, true);
  }

}

    if(!num || !name || !section) return toast('الرقم والاسم والقسم مطلوبة.');
    if(S.staff.some(s => String(s.num) === num && s.id !== d.id)) return toast('الرقم الوظيفي مستخدم لموظف آخر.');
    const old = d.id ? staffById(d.id) : null, data = Object.assign({}, old || { created: Date.now(), st: {} }, { num, name, section, branch, extra: $('#pX').value.split(/,|،/).map(x => x.trim()).filter(Boolean), role: $('#pR').value, active: $('#pA').value === '1' }); delete data.id;
    if(await Store.set('staff', d.id || rid(), data)){ closeModal(); toast('تم الحفظ.'); }
  },
  staffDel(d){ if(!d.ok) return confirmBox('حذف هذا الموظف؟ يُفضّل إيقافه بدلاً من الحذف للحفاظ على سجلاته.', 'staffDel', d.id); Store.del('staff', d.id).then(closeModal); },
  async resetPin(d){ if(S.mode === 'firebase'){ if(await fbCall('resetPin', { staffId: d.id })){ closeModal(); toast('سيعيّن الموظف رمزاً جديداً عند الدخول القادم.'); } return; }
    if(await Store.update('staff', d.id, { pinH: '' })){ closeModal(); toast('سيعيّن الموظف رمزاً جديداً عند الدخول القادم.'); } },
  importStaff(){ openModal(`<h2>استيراد الموظفين</h2><p class="sm mut" style="margin-top:0">سطر لكل موظف: <b>الرقم الوظيفي، الاسم، القسم، الفرع، الدور</b> (الدور: موظف أو مدقق أو مفتش، اختياري). يعيّن كل موظف رمزه السري عند أول دخول.</p>
    <textarea id="imp" style="height:220px" placeholder="1001، أحمد علي، الهواتف، فرع المنصور&#10;1002، سارة محمد، الحاسبات، فرع المنصور، مدقق"></textarea><div id="impP"></div><button class="btn pri w" style="margin-top:10px" data-act="doImportStaff">استيراد</button>`); },
  async doImportStaff(){
    if(S.importing) return; const L = parseLines($('#imp').value); if(!L.length) return toast('لا توجد بيانات.');
    S.importing = true; const nums = new Set(S.staff.map(s => String(s.num))); let n = 0, skip = 0; const P = $('#impP');
    for(let i = 0; i < L.length; i++){
      const [num, name, section = '', branch = '', role = ''] = L[i];
      if(!name || nums.has(num)){ skip++; continue; } nums.add(num);
      const ok = await Store.set('staff', rid(), { num, name, section, branch, role: /مفتش|insp/i.test(role) ? 'insp' : /مدقق|مشرف|sup/i.test(role) ? 'sup' : 'staff', active: true, created: Date.now(), st: {} });
      if(!ok) break; n++;
      if(P) P.innerHTML = `<div class="prog"><i style="width:${Math.round(100 * (i + 1) / L.length)}%"></i></div><div class="sm mut">${i + 1} / ${L.length}</div>`;
    }
    S.importing = false; closeModal(); toast(`تم استيراد ${n} موظف${skip ? ' وتجاوز ' + skip + ' (مكرر أو ناقص)' : ''}.`);
  },
  async rvOk(d){
    const p = (S.proofs || []).find(x => x.id === d.id); if(!p) return;
    if(!(await Store.update('proof', p.id, { status: 'ok', by: S.me || 'admin', at: Date.now(), pts: (p.pts || 0) + (p.held || 0), held: 0 }))) return;
    if(p.held > 0){ // منح النقاط المعلّقة بعد اعتماد المدقق
      const sm = S.sums.find(s => s.staff === p.staff && s.ym === p.ym), st = staffById(p.staff);
      if(sm) await Store.update('sum', sm.id, { pts: (sm.pts || 0) + p.held });
      if(st) await Store.update('staff', st.id, { st: { life: ((st.st || {}).life || 0) + p.held } });
    }
  },
  async rvBulk(){
    const L = (S.proofs || []).filter(p => inScope({ section: p.section }) && p.status === 'pending' && !p.sus).slice(0, 60);
    for(const p of L) await A.rvOk({ id: p.id });
    toast('اعتُمدت ' + L.length + ' عملية.');
  },
  rvImg(d){ openModal(`<img src="${esc(d.src)}" style="width:100%;border-radius:10px">`); },
  async rvRej(d){
    if(!d.ok) return confirmBox('رفض العملية وخصم نقاطها من الموظف؟', 'rvRej', d.id);
    closeModal(); const p = (S.proofs || []).find(x => x.id === d.id); if(!p) return;
    if(await Store.update('proof', p.id, { status: 'rej', by: S.me || 'admin', at: Date.now() })){
      const sm = S.sums.find(s => s.staff === p.staff && s.ym === p.ym);
      if(sm && p.pts > 0) await Store.update('sum', sm.id, { pts: Math.max(0, (sm.pts || 0) - p.pts), rej: (sm.rej || 0) + 1 });
      const st = staffById(p.staff); if(st && p.pts > 0) await Store.update('staff', st.id, { st: { life: Math.max(0, ((st.st || {}).life || 0) - p.pts) } });
      toast('تم الرفض وخصم ' + p.pts + ' نقطة.');
    }
  },
  togCfg(d){ saveCfg({ [d.k]: !cfg(d.k) }); },
  editOrg(){ openModal(`<h2>اسم الشركة / الفرع</h2><input id="on" value="${esc(cfg('orgName'))}"><div style="height:10px"></div><button class="btn pri w" data-act="orgSave">حفظ</button>`); },
  async orgSave(){ const v = $('#on').value.trim(); if(v && await saveCfg({ orgName: v })) closeModal(); },
  // معايرة بنقطتين: صورة لسطح مغبّر (يُفترض مؤشرها ≈ 70) ثم صورة للمكان نفسه بعد تنظيفه جيداً (≈ 0).
  // تُحسب الحساسية وخط الأساس (حبيبات النسيج الطبيعية في السطح النظيف) فتصبح الأرقام مطابقة لمواقعكم.
  calibrate(){ S.cal = {}; openModal(`<h2>معايرة من مواقعكم</h2><ol class="sm" style="padding-inline-start:18px;line-height:1.9"><li>اختر سطحاً عليه غبار واضح (رف أو زجاج أو جهاز)، وصوّره من قرب (20 إلى 40 سم) بإضاءة جيدة.</li><li>نظّفها جيداً، ثم صوّر <b>المكان نفسه</b> بالمسافة والزاوية نفسيهما.</li></ol><p class="xs mut">يُحلَّل وسط الصورة (80%). كرّر المعايرة عند تغيير نوع الأسطح أو الإضاءة.</p><button class="btn pri w" data-act="calShot" data-k="dirty">${ic('cam')} 1) تصوير السطح المغبّر</button>`); },
  async calShot(d){
    const f = await pickPhoto(); if(!f) return;
    toast('جارٍ التحليل…');
    let an; try{ an = await analyzeRegion(await loadImg(f), { x: 0.1, y: 0.1, w: 0.8, h: 0.8 }, 1, DUST_MAX, { d0: 0, h0: 0 }); }catch(e){ return toast('تعذّرت قراءة الصورة.'); }
    if(qualityBad(an)) toast(qualityBad(an) + ' يُفضّل إعادة التصوير.', 4000);
    S.cal = S.cal || {}; S.cal[d.k] = an.density; S.cal[d.k + 'H'] = an.haze;
    if(d.k === 'dirty') return openModal(`<h2>معايرة من مواقعكم</h2><p class="sm">سُجّلت صورة السطح المغبّر (${an.n} حبيبة).</p><p class="sm">الآن نظّف السطح جيداً، ثم صوّر <b>المكان نفسه</b> بالمسافة نفسها.</p><button class="btn pri w" data-act="calShot" data-k="clean">${ic('cam')} 2) تصوير السطح بعد التنظيف</button>`);
    const dd = S.cal.dirty, dc = S.cal.clean, K = 10;
    if(!(dd > dc * 1.4 && dd - dc > 0.4)) return openModal(`<h2>تعذّرت المعايرة</h2><p class="sm">الفرق بين الصورتين صغير جداً (${dd.toFixed(2)} مقابل ${dc.toFixed(2)})، فلا يستطيع المحرك التمييز بينهما بهذه الطريقة في التصوير.</p><ul class="sm"><li>اقترب أكثر من السطح.</li><li>استخدم ضوءاً جانبياً مائلاً (مصباح الهاتف من الجانب) لإبراز الغبار.</li><li>اختر سطحاً غباره أوضح.</li></ul><button class="btn pri w" data-act="calibrate">إعادة المعايرة</button>`);
    const d0 = Math.round(dc * 1.1 * 100) / 100, sens = Math.round(Math.max(0.2, Math.min(5, 1.204 * K / (dd - d0))) * 100) / 100;
    const h0 = Math.round((S.cal.cleanH * 1.1 + 0.01) * 1000) / 1000;
    if(await saveCfg({ sens, d0, h0 })){
      const idx = dens => Math.round(100 * (1 - Math.exp(-Math.max(0, dens - d0) * sens / K)));
      openModal(`<h2>تمت المعايرة</h2><p class="sm">بالإعدادات الجديدة: السطح المغبّر ≈ <b>${idx(dd)}</b>، وبعد التنظيف ≈ <b>${idx(dc)}</b>.</p><p class="xs mut">الحساسية ×${sens} · خط الأساس ${d0}</p><button class="btn pri w" data-act="closeModal">تم</button>`);
    }
  },
  async prune(){
    toast('جارٍ الحذف…'); let n = 0;
    try{ for(let r = 0; r < 10; r++){ const a = await Store.query('proof', ['ts', '<', Date.now() - 30 * DAY], 50); if(!a.length) break; for(const p of a){ await Store.del('proof', p.id); n++; } } }catch(e){}
    toast(n ? 'حُذفت ' + n + ' صورة إثبات.' : 'لا توجد صور قديمة.');
  },
  chgAdminPin(){ openModal(`<h2>رمز الإدارة الجديد</h2><input id="ap" type="password" inputmode="numeric"><div style="height:10px"></div><button class="btn pri w" data-act="apSave">حفظ</button>`); },
  apSave(){ const v = $('#ap').value.trim(); if(!/^\d{4,8}$/.test(v)) return toast('من 4 إلى 8 أرقام.'); LS.set('dh2_apin', v); closeModal(); toast('تم الحفظ.'); },
  wipe(d){ if(!d.ok) return confirmBox('مسح جميع البيانات من هذا الجهاز؟ لا يمكن التراجع.', 'wipe'); LS.del(LKEY); LS.del('dh2_me'); location.reload(); },
  csvSec(){
    const by = {}; S.zones.filter(inScope).forEach(z => { const k = (z.branch || '') + '|' + (z.section || ''); const o = by[k] = by[k] || { b: z.branch || '', s: z.section || '', t: 0, d: 0, f: 0 }; o.t++; if(zoneState(z).due) o.d++; if(zoneState(z).flagged) o.f++; });
    copyText(csv([['الفرع', 'القسم', 'المواقع', 'متأخرة', 'بلاغات', 'الالتزام %']].concat(Object.values(by).map(o => [o.b, o.s, o.t, o.d, o.f, Math.round(100 * (o.t - o.d) / o.t)]))), 'تم النسخ. الصقه في إكسل.');
  },
  csvStaff(){
    const rows = S.staff.filter(p => S.admin.all || S.admin.sections.includes(p.section)).map(p => { const s = S.sums.find(x => x.staff === p.id) || {}; return [p.num, p.name, p.branch || '', p.section || '', s.pts || 0, s.n || 0, s.n ? Math.round(s.redSum / s.n * 100) : 0, s.res || 0, s.fail || 0, s.flag || 0, s.sus || 0, s.rej || 0]; });
    copyText(csv([['الرقم', 'الاسم', 'الفرع', 'القسم', 'النقاط', 'العمليات', 'متوسط الإزالة %', 'متأخرة عولجت', 'غير مكتملة', 'بلاغات', 'قيد المراجعة', 'مرفوضة']].concat(rows)), 'تم النسخ. الصقه في إكسل.');
  }
};
document.addEventListener('click', e => {
  lastAct = Date.now();
  const el = e.target.closest('[data-act]'); if(!el) return; const fn = A[el.dataset.act]; if(!fn || el.tagName === 'SELECT') return;
  if(el.tagName !== 'INPUT') e.preventDefault(); fn(el.dataset, el, e);
});
// الفلاتر: حقول البحث والقوائم
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.f; if(!k || e.target.tagName === 'SELECT') return; const [o, p] = k.split('.'); S[o][p] = e.target.value; S[o].lim = o === 'zf' ? 40 : 50; clearTimeout(window._ft); window._ft = setTimeout(() => render(true), 200); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.f; if(!k || e.target.tagName !== 'SELECT') return; const [o, p] = k.split('.'); S[o][p] = e.target.value; render(true); });
document.addEventListener('keydown', e => { lastAct = Date.now(); if(e.key !== 'Enter') return; const id = e.target.id; const m = { lgNum: 'lgNext', lgPin: 'lgPin', np2: 'lgSetPin', suPin: 'lgSetup', codeIn: 'codeGo', codeIn2: 'codeCheck', pinA: 'adminPin' }[id]; if(m) A[m]({}, e.target, e); });
document.addEventListener('touchstart', () => { lastAct = Date.now(); }, { passive: true });
setInterval(() => {
  if(S.ready && ymOf() !== S.ym) subscribeMonth();
  if(S.me && S.shared && Date.now() - lastAct > 5 * 60e3 && !(F && F.step !== 'zone')){ logout(); toast('تم تسجيل الخروج تلقائياً.'); return; }
  const busy = (F && S.tab === 'clean') || $('#modal').innerHTML || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if(!busy) render();
}, 30000);
// Firebase: الهوية من رمز الدخول (sid/role/admin)، والاشتراك بالبيانات بعد الدخول فقط
function fbBoot(){
  S.shared = LS.get('dh2_shared', false);
  Store.listenDoc('config', 'main', d => { S.config = d || {}; scheduleRender(); });
  FB.onAuthStateChanged(Store.fb.auth, async u => {
    if(!u){ S.me = null; S.canManage = false; S.ready = true; render(true); return; }
    let t = {}; try{ t = (await FB.getIdTokenResult(u)).claims || {}; }catch(e){}
    if(!t.sid){ FB.signOut(Store.fb.auth); return; }
    S.me = t.sid; S.role = t.role; S.canManage = !!t.admin; LS.set('dh2_me', t.sid);
    if(!S.subscribed){ S.subscribed = true; S.ready = false; render(true); subscribeBase(); } else { subscribeAct(); render(true); }
    setTimeout(() => { if(S.me && S.ready && S.staff.length && (!me() || me().active === false)){ toast('هذا الحساب موقوف.'); logout(); } }, 5000);
  });
}
render();
Store.init().then(() => {
  if(S.mode === 'firebase'){ fbBoot(); return; }
  const saved = LS.get('dh2_me', null); S.shared = LS.get('dh2_shared', false);
  if(saved) S.me = saved;
  subscribeBase();
  // تحقق من أن المستخدم المحفوظ ما زال موجوداً وفعّالاً
  setTimeout(() => { if(S.me && S.ready && S.staff.length && (!me() || me().active === false)) logout(); }, 4000);
});
</script>
</body>
