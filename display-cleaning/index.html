<style>

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:'IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14.5px;line-height:1.6}

.wrap{max-width:760px;margin:0 auto;padding:0 14px}
header{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}

.btn.w{width:100%}

.tg{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 0;border-bottom:1px solid var(--line2)}
.tg:last-child{border:0}
.sw{width:44px;height:24px;border-radius:20px;background:#cfd6df;position:relative;flex:none}
.sw.on{background:var(--pri)}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}
.sw.on::after{right:23px}

.prog i{display:block;height:100%;background:var(--pri);transition:width .2s}

.ok-anim svg{width:34px;height:34px;stroke-width:2.4}
@keyframes pop{from{transform:scale(.5);opacity:0}}
.mission{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px solid var(--line2)}
.mission:last-child{border:0}
.mission .ck{width:22px;height:22px;border-radius:6px;border:1.5px solid #c3ccd7;display:grid;place-items:center;flex:none}
.mission.done .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.mission.done .ck svg{width:14px;height:14px;stroke-width:3}
.mission.done .t{color:var(--mut)}
</style>

<script>
"use strict";
/* ================= أدوات ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = {
  get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } },
  set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); return true; }catch(e){ return false; } },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
const sleep = ms => new Promise(r => setTimeout(r, ms));
const HOUR = 3600e3, DAY = 864e5;
const withTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
function toast(m, ms = 2800){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const pad = n => String(n).padStart(2, '0');
const ymOf = (ts = Date.now()) => { const d = new Date(ts); return d.getFullYear() + pad(d.getMonth() + 1); };
const dOf = (ts = Date.now()) => String(new Date(ts).getDate());
const dayKey = (ts = Date.now()) => { const d = new Date(ts); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
const MONTHS = ['كانون الثاني','شباط','آذار','نيسان','أيار','حزيران','تموز','آب','أيلول','تشرين الأول','تشرين الثاني','كانون الأول'];
function ago(ts){
  if(!ts) return 'لم تُنظَّف بعد';
  const m = Math.round((Date.now() - ts) / 60000);
  if(m < 1) return 'الآن'; if(m < 60) return 'منذ ' + m + ' دقيقة';
  const h = Math.round(m / 60); if(h < 24) return 'منذ ' + h + ' ساعة';
  const d = Math.round(h / 24); return d === 1 ? 'منذ يوم' : 'منذ ' + d + ' أيام';
}
const IC = {
  home:'M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z', grid:'M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z',
  cam:'M4 8h3l2-3h6l2 3h3v11H4zM12 17a4 4 0 1 0 0-8 4 4 0 0 0 0 8z', chart:'M4 20V10M10 20V4M16 20v-7M22 20H2',
  user:'M12 12a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM4 21a8 8 0 0 1 16 0', cog:'M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM19 12l2-1-1-3-2 .3-1.5-1.5L17 5l-3-1-1 2h-2L10 4 7 5l.5 2.3L6 8.8 4 8.5 3 11.5 5 12.5v2L3 15.5 4 18.5l2-.3 1.5 1.5L7 22l3 1 1-2h2l1 2 3-1-.5-2.3 1.5-1.5 2 .3 1-3-2-1z',
  search:'M11 18a7 7 0 1 0 0-14 7 7 0 0 0 0 14zM21 21l-5-5', alert:'M12 3l10 18H2zM12 10v5M12 18v.5', check:'M5 12l5 5L20 7',
  clock:'M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 2', out:'M15 4h4v16h-4M10 8l-4 4 4 4M6 12h11', qr:'M4 4h6v6H4zM14 4h6v6h-6zM4 14h6v6H4zM14 14h2v2h-2zM18 18h2v2h-2zM18 14h2M14 18h2',
  flag:'M5 21V4h11l-2 4 2 4H5', award:'M12 15a6 6 0 1 0 0-12 6 6 0 0 0 0 12zM8.5 14L7 22l5-3 5 3-1.5-8', x:'M6 6l12 12M18 6L6 18',
  plus:'M12 5v14M5 12h14', edit:'M4 20h4L19 9l-4-4L4 16zM14 6l4 4', up:'M12 16V4M7 9l5-5 5 5M4 20h16', list:'M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01',
  shield:'M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z', fire:'M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-7 1.5 1 3 2 3 4', tag:'M3 12V4h8l10 10-8 8zM7.5 7.5h.01',
  eye:'M2 12s4-7 10-7 10 7 10 7-4 7-10 7S2 12 2 12zM12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z', copy:'M8 8h12v12H8zM4 16V4h12', trash:'M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3',
  star:'M12 3l2.8 5.7 6.2.9-4.5 4.4 1 6.2L12 17.3 6.5 20.2l1-6.2L3 9.6l6.2-.9z', back:'M9 6l6 6-6 6'
};
const ic = (n, s) => `<svg class="i" viewBox="0 0 24 24" ${s ? `style="width:${s}px;height:${s}px"` : ''}><path d="${IC[n] || ''}"/></svg>`;
const initials = n => { const p = String(n || '').trim().split(/\s+/); return esc((p[0] || '؟').slice(0, 1) + (p[1] ? p[1].slice(0, 1) : '')); };

/* ================= محرك كشف الغبار (الإصدار 2) =================
   المشكلة في الإصدار الأول: حبكة القماش ونقوش السطح والخلفية تُقرأ كغبار.
   1) التحليل على منطقة يحددها الموظف (سطح العارضة فقط) وبدقة أعلى (حتى 900px للمنطقة).
   2) فتح مورفولوجي بعناصر خطية في 4 اتجاهات: الحبيبة تختفي في كل الاتجاهات، أما الخيوط
      والحواف والنقوش فتبقى في اتجاه واحد على الأقل، فتُستبعد تلقائياً.
   3) عتبة إحصائية محلية (المئين 95 لكل كتلة 24×24) تتكيّف مع نسيج كل سطح.
   4) مرشحات شكل (حجم، استطالة) ولون (الغبار رمادي محايد) واستبعاد اللمعان والمناطق المحترقة.
   5) يعمل داخل Web Worker حتى لا تتجمد الواجهة، مع بديل على الخيط الرئيسي. */
function analyzeDust(px, w, h, sens, opt){
  sens = sens || 1; opt = opt || {};
  const N = w * h, L = new Float32Array(N), C = new Float32Array(N);
  for(let i = 0, j = 0; i < N; i++, j += 4){
    const r = px[j], g = px[j + 1], b = px[j + 2];
    L[i] = 0.299 * r + 0.587 * g + 0.114 * b;
    C[i] = Math.max(r, g, b) - Math.min(r, g, b);
  }
  // تنعيم ثنائي الحدود 3×3 (قابل للفصل) لإزالة ضوضاء الحساس وضغط JPEG
  const tmp = new Float32Array(N), Ls = new Float32Array(N);
  for(let y = 0; y < h; y++){ const o = y * w; for(let x = 0; x < w; x++){ const a = L[o + (x > 0 ? x - 1 : x)], c = L[o + (x < w - 1 ? x + 1 : x)]; tmp[o + x] = (a + 2 * L[o + x] + c) / 4; } }
  for(let y = 0; y < h; y++){ const up = (y > 0 ? y - 1 : y) * w, dn = (y < h - 1 ? y + 1 : y) * w, o = y * w; for(let x = 0; x < w; x++) Ls[o + x] = (tmp[up + x] + 2 * tmp[o + x] + tmp[dn + x]) / 4; }
  // جودة الصورة
  let sum = 0; for(let i = 0; i < N; i++) sum += L[i];
  const mean = sum / N;
  let ls = 0, ls2 = 0, lc = 0;
  for(let y = 1; y < h - 1; y += 2) for(let x = 1; x < w - 1; x += 2){ const i = y * w + x, l = 4 * L[i] - L[i - 1] - L[i + 1] - L[i - w] - L[i + w]; ls += l; ls2 += l * l; lc++; }
  const sharp = lc ? ls2 / lc - (ls / lc) ** 2 : 0;

  // 1) فتح/إغلاق مورفولوجي بعناصر خطية في 4 اتجاهات.
  //    الحبيبة أصغر من العنصر في كل الاتجاهات فتختفي في كل فتح ⇒ تظهر في min.
  //    الخيوط والحواف والنقوش الطولية تبقى في اتجاه واحد على الأقل ⇒ min≈0.
  const R = opt.R || Math.max(3, Math.min(8, Math.round(Math.max(w, h) / 220)));

  // اشتراك بمجموعة مع شرط اختياري
  listen(col, where, opt, cb){
    if(this.fb) return FB.onSnapshot(this._q(col, where, opt), s => cb(s.docs.map(d => this._dec(col, d.id, d.data())), s.metadata), e => cb(null, null, e));
    if(this.db){
      let q = this.db.collection(col);
      if(where) q = q.where(where[0], where[1], where[2]);
      if(opt && opt.order) q = q.orderBy(opt.order[0], opt.order[1]);
      if(opt && opt.limit) q = q.limit(opt.limit);
      return q.onSnapshot(s => cb(s.docs.map(d => Object.assign({ id: d.id }, d.data())), s.metadata), e => cb(null, null, e));
    }
    const run = () => {
      let a = Object.entries(this.local[col] || {}).map(([id, v]) => Object.assign({ id }, v));
      if(where) a = a.filter(d => where[1] === '==' ? d[where[0]] === where[2] : where[1] === '<' ? d[where[0]] < where[2] : where[1] === '>=' ? d[where[0]] >= where[2] : true);
      if(opt && opt.order){ const [f, dir] = opt.order; a.sort((p, q) => (dir === 'desc' ? -1 : 1) * ((p[f] || 0) - (q[f] || 0))); }
      if(opt && opt.limit) a = a.slice(0, opt.limit);
      cb(a, { fromCache: false });
    };
    const L = { col, run }; this.ls.push(L); setTimeout(run, 0);
    return () => { this.ls = this.ls.filter(x => x !== L); };
  },
  listenDoc(col, id, cb){
    if(this.fb) return FB.onSnapshot(this._ref(col, id), d => cb(d.exists() ? this._dec(col, d.id, d.data()) : null), () => cb(null));
    if(this.db) return this.db.collection(col).doc(id).onSnapshot(d => cb(d.exists ? Object.assign({ id: d.id }, d.data()) : null), () => cb(null));
    const run = () => { const v = (this.local[col] || {})[id]; cb(v ? Object.assign({ id }, v) : null); };
    const L = { col, run }; this.ls.push(L); setTimeout(run, 0);
    return () => { this.ls = this.ls.filter(x => x !== L); };
  },
  async getDoc(col, id){
    if(this.fb){ const d = await FB.getDoc(this._ref(col, id)); return d.exists() ? this._dec(col, d.id, d.data()) : null; }
    if(this.db){ const d = await this.db.collection(col).doc(id).get(); return d.exists ? Object.assign({ id: d.id }, d.data()) : null; }
    const v = (this.local[col] || {})[id]; return v ? Object.assign({ id }, JSON.parse(JSON.stringify(v))) : null;
  },
  async query(col, where, limit){
    if(this.fb){ const s = await FB.getDocs(this._q(col, where, { limit })); return s.docs.map(d => this._dec(col, d.id, d.data())); }
    if(this.db){ const s = await this.db.collection(col).where(where[0], where[1], where[2]).limit(limit).get(); return s.docs.map(d => Object.assign({ id: d.id }, d.data())); }
    return Object.entries(this.local[col] || {}).map(([id, v]) => Object.assign({ id }, v)).filter(d => where[1] === '<' ? d[where[0]] < where[2] : d[where[0]] === where[2]).slice(0, limit);
  },
  persist(){
    if(LS.set(LKEY, this.local)) return;
    const p = this.local.proof || {}; const keys = Object.keys(p).sort((a, b) => (p[a].ts || 0) - (p[b].ts || 0));
    keys.slice(0, Math.ceil(keys.length / 2)).forEach(k => delete p[k]);
    if(!LS.set(LKEY, this.local)) toast('مساحة التخزين المحلي ممتلئة');
  },
  notify(col){ this.persist(); this.ls.filter(l => l.col === col).forEach(l => l.run()); },
  // كل عمليات الكتابة بالتسلسل: كتابة واحدة في كل مرة
  run(fn, silent){
    const p = this.q.then(async () => {
      for(let a = 0; a < 4; a++){
        try{ await fn(); return true; }
        catch(e){
          const c = e && e.code && String(e.code).replace(/-/g, '_');
          if((c === 'unavailable' || c === 'resource_exhausted') && a < 3){ await sleep(800 * (a + 1) + Math.random() * 600); continue; }
          if(!silent){
            if(c === 'permission_denied') toast('لا تملك صلاحية هذا الإجراء.');
            else if(c === 'invalid_argument' && this.db){ S.readOnly = true; toast('لا تملك صلاحية الحفظ. اطلب من المسؤول منحك صلاحية «مساهم».'); }
            else if(c === 'quota_exceeded') toast('امتلأت سعة قاعدة البيانات. احذف سجلات الإثبات القديمة من الإعدادات.');
            else toast('تعذّر الحفظ. حاول مرة أخرى.');
          }
          return false;
        }
      }
      return false;
    });
    this.q = p.catch(() => false); return p;
  },
  set(col, id, data, silent){ return this.run(async () => {
    if(this.fb) await this._w(FB.setDoc(this._ref(col, id), this._enc(col, data)));
    else if(this.db) await this.db.collection(col).doc(id).set(data);
    else { (this.local[col] = this.local[col] || {})[id] = JSON.parse(JSON.stringify(data)); this.notify(col); }
  }, silent); },
  update(col, id, patch){ return this.run(async () => {
    if(this.fb) await this._w(FB.setDoc(this._ref(col, id), this._enc(col, patch), { merge: true })); // merge يدمج الكائنات المتداخلة
    else if(this.db) await this.db.collection(col).doc(id).update(patch);
    else { const c = this.local[col] = this.local[col] || {}; if(!c[id]) throw { code: 'invalid_argument' }; const merge = (t, s) => { for(const k in s){ if(s[k] && typeof s[k] === 'object' && !Array.isArray(s[k]) && t[k] && typeof t[k] === 'object') merge(t[k], s[k]); else t[k] = s[k]; } }; merge(c[id], JSON.parse(JSON.stringify(patch))); this.notify(col); }
  }); },
  del(col, id){ return this.run(async () => {
    if(this.fb) await this._w(FB.deleteDoc(this._ref(col, id)));
    else if(this.db) await this.db.collection(col).doc(id).delete();
    else { if(this.local[col]) delete this.local[col][id]; this.notify(col); }
  }); }
};

function zoneState(z){
  const iv = (z.interval || 24) * HOUR, last = z.lastClean || 0, el = last ? (Date.now() - last) / iv : 9;
  const flagged = !!(z.flaggedAt && z.flaggedAt > last);
  let fresh = Math.max(0, Math.round(100 * (1 - el))); if(flagged) fresh = Math.min(fresh, 10);
  const due = el >= 1 || flagged, st = due ? 'da' : el >= 0.75 ? 'wa' : 'ok';

function streakNow(st){ if(!st || !st.lastDay) return 0; const y = dayKey(Date.now() - DAY); return st.lastDay === dayKey() || st.lastDay === y ? (st.streak || 0) : 0; }
function myTodayEntries(){ const t0 = new Date(); t0.setHours(0, 0, 0, 0); return ((S.myAct && S.myAct.e) || []).filter(e => e[0] >= t0.getTime()); }

function branchesAll(){ return [...new Set(S.zones.map(z => z.branch).filter(Boolean).concat(S.staff.map(s => s.branch).filter(Boolean)))].sort((a, b) => a.localeCompare(b, 'ar')); }

async function hashPin(id, pin){
  const s = 'dh|' + id + '|' + pin;
  try{ const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join(''); }
  catch(e){ let h = 2166136261; for(let i = 0; i < s.length; i++){ h ^= s.charCodeAt(i); h = Math.imul(h, 16777619); } return 'f' + (h >>> 0).toString(16); }
}
let AC = null;
function tone(ok = true){
  if(!cfg('sound')) return;
  try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); const n = ok ? [660, 880] : [440];
    n.forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .12; o.type = 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.12, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .3); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .32); }); }catch(e){}
  try{ navigator.vibrate && navigator.vibrate(30); }catch(e){}
}

  if(bonus) toast('أكملت المهام اليومية: +15 نقطة');
  // 4) العارضة
  if(type === 'c') await Store.update('zones', z.id, { lastClean: ts, lastBy: m.id, lastIdx: R.a, flaggedAt: 0 });
  if(type === 'k' && extra.resetZone) await Store.update('zones', z.id, { lastClean: ts, lastBy: m.id, lastIdx: R.a, flaggedAt: 0 });

  // 5) إثبات للمراجعة: المشكوك فيها + البلاغات + عيّنة عشوائية
  const sample = Math.random() * 100 < (+cfg('auditRate') || 0);
  if(R.sus || type === 'f' || sample){
    await Store.set('proof', rid(), { ts, ym, staff: m.id, zone: z.id, zoneName: z.name, section: z.section || '', branch: z.branch || '', type, before: R.b, after: R.a,

  }

}

      const [num, name, section = '', branch = '', role = ''] = L[i];
      if(!name || nums.has(num)){ skip++; continue; } nums.add(num);
      const ok = await Store.set('staff', rid(), { num, name, section, branch, role: /مشرف|sup/i.test(role) ? 'sup' : 'staff', active: true, created: Date.now(), st: {} });
      if(!ok) break; n++;
      if(P) P.innerHTML = `<div class="prog"><i style="width:${Math.round(100 * (i + 1) / L.length)}%"></i></div><div class="sm mut">${i + 1} / ${L.length}</div>`;
    }
    S.importing = false; closeModal(); toast(`تم استيراد ${n} موظف${skip ? ' وتجاوز ' + skip + ' (مكرر أو ناقص)' : ''}.`);
  },
  async rvOk(d){ await Store.update('proof', d.id, { status: 'ok', by: S.me || 'admin', at: Date.now() }); },
  async rvRej(d){
    if(!d.ok) return confirmBox('رفض العملية وخصم نقاطها من الموظف؟', 'rvRej', d.id);
    closeModal(); const p = (S.proofs || []).find(x => x.id === d.id); if(!p) return;
    if(await Store.update('proof', p.id, { status: 'rej', by: S.me || 'admin', at: Date.now() })){
      const sm = S.sums.find(s => s.staff === p.staff && s.ym === p.ym);
      if(sm && p.pts > 0) await Store.update('sum', sm.id, { pts: Math.max(0, (sm.pts || 0) - p.pts), rej: (sm.rej || 0) + 1 });
      const st = staffById(p.staff); if(st && p.pts > 0) await Store.update('staff', st.id, { st: { life: Math.max(0, ((st.st || {}).life || 0) - p.pts) } });
      toast('تم الرفض وخصم ' + p.pts + ' نقطة.');
    }
  },
  togCfg(d){ saveCfg({ [d.k]: !cfg(d.k) }); },
  editOrg(){ openModal(`<h2>اسم الشركة / الفرع</h2><input id="on" value="${esc(cfg('orgName'))}"><div style="height:10px"></div><button class="btn pri w" data-act="orgSave">حفظ</button>`); },
  async orgSave(){ const v = $('#on').value.trim(); if(v && await saveCfg({ orgName: v })) closeModal(); },
  async calibrate(){
    const f = await pickPhoto(); if(!f) return;
    toast('جارٍ تحليل صورة المعايرة…');
    try{ const an = await analyzeRegion(await loadImg(f), { x: 0.1, y: 0.1, w: 0.8, h: 0.8 }, 1);
      // السطح النظيف يجب أن يعطي مؤشراً ≤ 8. نخفّض الحساسية فقط إذا قرأ السطح النظيف أعلى من ذلك.
      const s = an.idx > 8 ? Math.max(0.3, Math.min(1, 0.834 / an.density)) : 1;
      if(await saveCfg({ sens: Math.round(s * 100) / 100 })) toast('تمت المعايرة. مؤشر السطح النظيف ' + an.idx + ' · الحساسية ×' + s.toFixed(2)); }catch(e){ toast('تعذّرت قراءة الصورة.'); }
  },
  async prune(){
    toast('جارٍ الحذف…'); let n = 0;
    try{ for(let r = 0; r < 10; r++){ const a = await Store.query('proof', ['ts', '<', Date.now() - 30 * DAY], 50); if(!a.length) break; for(const p of a){ await Store.del('proof', p.id); n++; } } }catch(e){}
    toast(n ? 'حُذفت ' + n + ' صورة إثبات.' : 'لا توجد صور قديمة.');
  },
  chgAdminPin(){ openModal(`<h2>رمز الإدارة الجديد</h2><input id="ap" type="password" inputmode="numeric"><div style="height:10px"></div><button class="btn pri w" data-act="apSave">حفظ</button>`); },
  apSave(){ const v = $('#ap').value.trim(); if(!/^\d{4,8}$/.test(v)) return toast('من 4 إلى 8 أرقام.'); LS.set('dh2_apin', v); closeModal(); toast('تم الحفظ.'); },
  wipe(d){ if(!d.ok) return confirmBox('مسح جميع البيانات من هذا الجهاز؟ لا يمكن التراجع.', 'wipe'); LS.del(LKEY); LS.del('dh2_me'); location.reload(); },
  csvSec(){
    const by = {}; S.zones.filter(inScope).forEach(z => { const k = (z.branch || '') + '|' + (z.section || ''); const o = by[k] = by[k] || { b: z.branch || '', s: z.section || '', t: 0, d: 0, f: 0 }; o.t++; if(zoneState(z).due) o.d++; if(zoneState(z).flagged) o.f++; });
    copyText(csv([['الفرع', 'القسم', 'العارضات', 'متأخرة', 'بلاغات', 'الالتزام %']].concat(Object.values(by).map(o => [o.b, o.s, o.t, o.d, o.f, Math.round(100 * (o.t - o.d) / o.t)]))), 'تم النسخ. الصقه في إكسل.');
  },
  csvStaff(){
    const rows = S.staff.filter(p => S.admin.all || S.admin.sections.includes(p.section)).map(p => { const s = S.sums.find(x => x.staff === p.id) || {}; return [p.num, p.name, p.branch || '', p.section || '', s.pts || 0, s.n || 0, s.n ? Math.round(s.redSum / s.n * 100) : 0, s.res || 0, s.fail || 0, s.flag || 0, s.sus || 0, s.rej || 0]; });
    copyText(csv([['الرقم', 'الاسم', 'الفرع', 'القسم', 'النقاط', 'العمليات', 'متوسط الإزالة %', 'متأخرة عولجت', 'غير مكتملة', 'بلاغات', 'قيد المراجعة', 'مرفوضة']].concat(rows)), 'تم النسخ. الصقه في إكسل.');
  }
};
document.addEventListener('click', e => {
  lastAct = Date.now();
  const el = e.target.closest('[data-act]'); if(!el) return; const fn = A[el.dataset.act]; if(!fn || el.tagName === 'SELECT') return;
  if(el.tagName !== 'INPUT') e.preventDefault(); fn(el.dataset, el, e);
});
// الفلاتر: حقول البحث والقوائم
document.addEventListener('input', e => { const k = e.target.dataset && e.target.dataset.f; if(!k || e.target.tagName === 'SELECT') return; const [o, p] = k.split('.'); S[o][p] = e.target.value; S[o].lim = o === 'zf' ? 40 : 50; clearTimeout(window._ft); window._ft = setTimeout(() => render(true), 200); });
document.addEventListener('change', e => { const k = e.target.dataset && e.target.dataset.f; if(!k || e.target.tagName !== 'SELECT') return; const [o, p] = k.split('.'); S[o][p] = e.target.value; render(true); });
document.addEventListener('keydown', e => { lastAct = Date.now(); if(e.key !== 'Enter') return; const id = e.target.id; const m = { lgNum: 'lgNext', lgPin: 'lgPin', np2: 'lgSetPin', suPin: 'lgSetup', codeIn: 'codeGo', codeIn2: 'codeCheck', pinA: 'adminPin' }[id]; if(m) A[m]({}, e.target, e); });
document.addEventListener('touchstart', () => { lastAct = Date.now(); }, { passive: true });
setInterval(() => {
  if(S.ready && ymOf() !== S.ym) subscribeMonth();
  if(S.me && S.shared && Date.now() - lastAct > 5 * 60e3 && !(F && F.step !== 'zone')){ logout(); toast('تم تسجيل الخروج تلقائياً.'); return; }
  const busy = (F && S.tab === 'clean') || $('#modal').innerHTML || (document.activeElement && /INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName));
  if(!busy) render();
}, 30000);
// Firebase: الهوية من رمز الدخول (sid/role/admin)، والاشتراك بالبيانات بعد الدخول فقط
function fbBoot(){
  S.shared = LS.get('dh2_shared', false);
  Store.listenDoc('config', 'main', d => { S.config = d || {}; scheduleRender(); });
  FB.onAuthStateChanged(Store.fb.auth, async u => {
    if(!u){ S.me = null; S.canManage = false; S.ready = true; render(true); return; }
    let t = {}; try{ t = (await FB.getIdTokenResult(u)).claims || {}; }catch(e){}
    if(!t.sid){ FB.signOut(Store.fb.auth); return; }
    S.me = t.sid; S.role = t.role; S.canManage = !!t.admin; LS.set('dh2_me', t.sid);
    if(!S.subscribed){ S.subscribed = true; S.ready = false; render(true); subscribeBase(); } else { subscribeAct(); render(true); }
    setTimeout(() => { if(S.me && S.ready && S.staff.length && (!me() || me().active === false)){ toast('هذا الحساب موقوف.'); logout(); } }, 5000);
  });
}
render();
Store.init().then(() => {
  if(S.mode === 'firebase'){ fbBoot(); return; }
  const saved = LS.get('dh2_me', null); S.shared = LS.get('dh2_shared', false);
  if(saved) S.me = saved;
  subscribeBase();
  // تحقق من أن المستخدم المحفوظ ما زال موجوداً وفعّالاً
  setTimeout(() => { if(S.me && S.ready && S.staff.length && (!me() || me().active === false)) logout(); }, 4000);
});
</script>
