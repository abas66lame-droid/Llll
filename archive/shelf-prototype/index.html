<style>
:root{--bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--line2:#eef1f5;--tx:#16202c;--mut:#6a7686;--nav:#0f2742;--pri:#0e6f7a;--pril:#e3f2f3;

body{padding-bottom:84px}

input:focus,select:focus{border-color:var(--pri)}
svg.i{width:20px;height:20px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}

header b{font-size:15px} header small{display:block;font-size:11.5px;opacity:.7;margin-top:-3px}
.mode{font-size:11px;padding:2px 8px;border-radius:20px;background:#ffffff1a;margin-inline-start:auto;white-space:nowrap}
.hbtn{height:34px;padding:0 10px;border-radius:9px;background:#ffffff14;color:#fff;font-size:12.5px;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}

<body>
<header><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="view"><div class="loading"><div><div class="spin"></div>جارٍ التحميل…</div></div></main>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div id="modal"></div>
<script>
"use strict";
/* CORE_START */
// ===== محرك مقارنة العارضة =====
// صورة رمادية: {g: Float32Array, w, h}
function resizeGray(src, W, H){
  const out = new Float32Array(W * H), sx = src.w / W, sy = src.h / H;
  for(let y = 0; y < H; y++){
    const y0 = Math.floor(y * sy), y1 = Math.max(y0 + 1, Math.floor((y + 1) * sy));
    for(let x = 0; x < W; x++){
      const x0 = Math.floor(x * sx), x1 = Math.max(x0 + 1, Math.floor((x + 1) * sx));
      let s = 0, c = 0;
      for(let yy = y0; yy < y1 && yy < src.h; yy++) for(let xx = x0; xx < x1 && xx < src.w; xx++){ s += src.g[yy * src.w + xx]; c++; }
      out[y * W + x] = c ? s / c : 0;
    }
  }
  return { g: out, w: W, h: H };
}
function gradMag(im){
  const { g, w, h } = im, o = new Float32Array(w * h);
  for(let y = 1; y < h - 1; y++) for(let x = 1; x < w - 1; x++){
    const i = y * w + x;
    const gx = g[i + 1] - g[i - 1] + 0.5 * (g[i - w + 1] - g[i - w - 1] + g[i + w + 1] - g[i + w - 1]);
    const gy = g[i + w] - g[i - w] + 0.5 * (g[i + w - 1] - g[i - w - 1] + g[i + w + 1] - g[i - w + 1]);
    o[i] = Math.sqrt(gx * gx + gy * gy);
  }
  return { g: o, w, h };
}
// قيمة بكسل بإحداثيات عشرية (ثنائي الخطية)
function bil(im, x, y){
  if(x < 0 || y < 0 || x > im.w - 1 || y > im.h - 1) return NaN;
  const x0 = Math.floor(x), y0 = Math.floor(y), x1 = Math.min(im.w - 1, x0 + 1), y1 = Math.min(im.h - 1, y0 + 1), fx = x - x0, fy = y - y0, g = im.g, w = im.w;
  return (g[y0 * w + x0] * (1 - fx) + g[y0 * w + x1] * fx) * (1 - fy) + (g[y1 * w + x0] * (1 - fx) + g[y1 * w + x1] * fx) * fy;
}
// تحويل إحداثيات طبيعية من المرجع إلى الحالية: u' = (u-.5)*s + .5 + tx
function mapUV(T, u, v){ return [(u - 0.5) * T.s + 0.5 + T.tx, (v - 0.5) * T.s + 0.5 + T.ty]; }
function nccMapped(A, B, T, step){
  let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
  for(let y = 2; y < A.h - 2; y += step) for(let x = 2; x < A.w - 2; x += step){
    const [u, v] = mapUV(T, x / (A.w - 1), y / (A.h - 1));
    const b = bil(B, u * (B.w - 1), v * (B.h - 1)); if(b !== b) continue;
    const a = A.g[y * A.w + x]; n++; sa += a; sb += b; saa += a * a; sbb += b * b; sab += a * b;
  }
  if(n < 50) return -1;
  const cov = sab - sa * sb / n, va = saa - sa * sa / n, vb = sbb - sb * sb / n;
  return va > 0 && vb > 0 ? cov / Math.sqrt(va * vb) : -1;
}
// محاذاة تلقائية (إزاحة + تكبير) بين الصورة المرجعية والحالية
function align(ref, cur){
  const W = 120, H = Math.max(40, Math.round(W * ref.h / ref.w));
  const A = gradMag(resizeGray(ref, W, H)), B = gradMag(resizeGray(cur, W, H));
  let best = { s: 1, tx: 0, ty: 0, c: nccMapped(A, B, { s: 1, tx: 0, ty: 0 }, 2) };
  for(let s = 0.86; s <= 1.141; s += 0.035) for(let dy = -14; dy <= 14; dy += 2) for(let dx = -14; dx <= 14; dx += 2){
    const T = { s, tx: dx / W, ty: dy / H }, c = nccMapped(A, B, T, 3);
    if(c > best.c) best = Object.assign(T, { c });
  }
  // تحسين دقيق
  const b0 = Object.assign({}, best);
  for(let ds = -0.03; ds <= 0.031; ds += 0.01) for(let dy = -2; dy <= 2; dy += 0.25) for(let dx = -2; dx <= 2; dx += 0.25){
    const T = { s: b0.s + ds, tx: b0.tx + dx / W, ty: b0.ty + dy / H }, c = nccMapped(A, B, T, 2);
    if(c > best.c) best = Object.assign(T, { c });
  }
  return best;
}
function patch(im, u0, v0, u1, v1, N, T){
  const o = new Float32Array(N * N); let bad = 0;
  for(let y = 0; y < N; y++) for(let x = 0; x < N; x++){
    // متوسط 3×3 عينات لكل خلية لتجنّب التشويش (aliasing) في النصوص والتفاصيل الدقيقة
    let acc = 0, cnt = 0;
    for(let sy = 0; sy < 3; sy++) for(let sx = 0; sx < 3; sx++){
      let u = u0 + (u1 - u0) * (x + (sx + 0.5) / 3) / N, v = v0 + (v1 - v0) * (y + (sy + 0.5) / 3) / N;
      if(T){ const m = mapUV(T, u, v); u = m[0]; v = m[1]; }
      const val = bil(im, u * (im.w - 1), v * (im.h - 1));
      if(val === val){ acc += val; cnt++; }
    }
    if(cnt < 5){ bad++; o[y * N + x] = 0; } else o[y * N + x] = acc / cnt;
  }
  return { g: o, w: N, h: N, bad: bad / (N * N) };
}
function ncc(a, b){
  const n = a.length; let sa = 0, sb = 0; for(let i = 0; i < n; i++){ sa += a[i]; sb += b[i]; }
  const ma = sa / n, mb = sb / n; let cov = 0, va = 0, vb = 0;
  for(let i = 0; i < n; i++){ const da = a[i] - ma, db = b[i] - mb; cov += da * db; va += da * da; vb += db * db; }
  return va > 1e-6 && vb > 1e-6 ? cov / Math.sqrt(va * vb) : (va <= 1e-6 && vb <= 1e-6 ? 1 : 0);
}
function sum(a){ let s = 0; for(let i = 0; i < a.length; i++) s += a[i]; return s; }
// مقارنة خانة منتج واحدة
function compareSlot(ref, cur, T, r){
  const N = 32, mu = 0.04 * r.w, mv = 0.04 * r.h;
  const pr = patch(ref, r.x, r.y, r.x + r.w, r.y + r.h, N, null);
  // نبحث عن أفضل تطابق ضمن إزاحة صغيرة لتعويض أخطاء المحاذاة
  let best = null;
  for(let oy = -2; oy <= 2; oy++) for(let ox = -2; ox <= 2; ox++){
    const pc = patch(cur, r.x + ox * mu, r.y + oy * mv, r.x + r.w + ox * mu, r.y + r.h + oy * mv, N, T);
    const c1 = ncc(pr.g, pc.g), gr = gradMag(pr), gc = gradMag(pc), c2 = ncc(gr.g, gc.g);
    const sim = 0.45 * c1 + 0.55 * c2, er = (sum(gc.g) + 1) / (sum(gr.g) + 1);
    if(!best || sim > best.sim) best = { sim, c1, c2, er, bad: pc.bad };
  }
  let st;
  if(best.bad > 0.3) st = 'out';
  else if(best.sim >= 0.55) st = 'ok';
  else if(best.sim < 0.25 || (best.er < 0.6 && best.sim < 0.45)) st = 'miss';
  else st = 'chg';
  best.st = st;
  best.conf = st === 'ok' ? Math.min(1, (best.sim - 0.55) / 0.4 + 0.5) : st === 'miss' ? Math.min(1, (0.5 - best.sim) / 0.4 + 0.4) : 0.4;
  return best;
}
function compareShelf(ref, cur, slots){
  const T = align(ref, cur);
  return { T, res: slots.map(s => compareSlot(ref, cur, T, s)) };
}

// ===== كشف التغيّر بدون خانات (شبكة تلقائية) =====
// الصورة: {g: رمادي, a: أحمر-أخضر, b: أصفر-أزرق, w, h}
function chan(im, k){ return { g: im[k], w: im.w, h: im.h }; }
function meanOf(p){ let s = 0; for(let i = 0; i < p.g.length; i++) s += p.g[i]; return s / p.g.length; }
function cellCompare(ref, cur, T, r, N){
  const mu = 0.12 * r.w, mv = 0.12 * r.h, pr = patch(ref, r.x, r.y, r.x + r.w, r.y + r.h, N, null), gr = gradMag(pr);
  const tr = sum(gr.g) / (N * N); let best = null, bo = [0, 0];
  for(let oy = -1; oy <= 1; oy++) for(let ox = -1; ox <= 1; ox++){
    const pc = patch(cur, r.x + ox * mu, r.y + oy * mv, r.x + r.w + ox * mu, r.y + r.h + oy * mv, N, T), gc = gradMag(pc);
    const sim = 0.45 * ncc(pr.g, pc.g) + 0.55 * ncc(gr.g, gc.g), tc = sum(gc.g) / (N * N);
    if(!best || sim > best.sim){ best = { sim, tr, tc, md: Math.abs(meanOf(pr) - meanOf(pc)), bad: pc.bad }; bo = [ox, oy]; }
  }
  const b = best;
  // فرق اللون (يكشف تبديل منتج بآخر بنفس الشكل ولون مختلف)
  let cd = 0;
  if(ref.a && cur.a){
    const n = 8, R = { x: r.x + bo[0] * mu, y: r.y + bo[1] * mv };
    const ra = meanOf(patch(chan(ref, 'a'), r.x, r.y, r.x + r.w, r.y + r.h, n, null)), rb = meanOf(patch(chan(ref, 'b'), r.x, r.y, r.x + r.w, r.y + r.h, n, null));
    const ca = meanOf(patch(chan(cur, 'a'), R.x, R.y, R.x + r.w, R.y + r.h, n, T)), cb = meanOf(patch(chan(cur, 'b'), R.x, R.y, R.x + r.w, R.y + r.h, n, T));
    cd = Math.hypot(ra - ca, rb - cb);
  }
  b.cd = cd;
  const lo = Math.max(b.tr, b.tc) < 5;
  if(b.bad > 0.3) b.st = 'out';
  else if(lo) b.st = (b.md > 45 || cd > 30) ? 'chg' : 'same';
  else if(b.sim < 0.5 && b.tc < 0.55 * b.tr) b.st = 'rem';
  else if(b.sim < 0.5 && b.tr < 0.55 * b.tc) b.st = 'add';
  else if(b.sim < 0.3 || cd > 28) b.st = 'chg';
  else b.st = 'same';
  return b;
}
function detectChanges(ref, cur, opt){
  opt = opt || {};
  const T = opt.T || align(ref, cur), GX = opt.GX || 16, GY = opt.GY || Math.max(8, Math.round(GX * ref.h / ref.w));
  const cells = [];
  for(let j = 0; j < GY; j++) for(let i = 0; i < GX; i++) cells.push(cellCompare(ref, cur, T, { x: i / GX, y: j / GY, w: 1 / GX, h: 1 / GY }, 16));
  const st = cells.map(c => c.st), lab = new Int32Array(st.length).fill(-1), comps = [];
  const nb = c => { const ci = c % GX, cj = (c / GX) | 0, o = []; if(ci > 0) o.push(c - 1); if(ci < GX - 1) o.push(c + 1); if(cj > 0) o.push(c - GX); if(cj < GY - 1) o.push(c + GX); return o; };
  const grow = (k, type, ok) => { const id = comps.length, q = [k], mem = []; lab[k] = id; while(q.length){ const c = q.pop(); mem.push(c); for(const n of nb(c)) if(lab[n] < 0 && ok(st[n])){ lab[n] = id; q.push(n); } } comps.push({ type, mem }); };
  // 1) مناطق النقص والإضافة، كل نوع على حدة
  // الخلايا "القوية" (تغيّر واضح في كامل الخلية) تكوّن المناطق؛ الضعيفة (جزء من الخلية) تُلحق فقط ولا تربط منطقتين
  const strong = cells.map(c => (c.st === 'rem' && c.tc < 0.38 * c.tr) || (c.st === 'add' && c.tr < 0.38 * c.tc));
  for(let k = 0; k < st.length; k++) if(lab[k] < 0 && strong[k]){ const t = st[k], id = comps.length, q = [k], mem = []; lab[k] = id;
    while(q.length){ const c = q.pop(); mem.push(c); for(const n of nb(c)) if(lab[n] < 0 && strong[n] && st[n] === t){ lab[n] = id; q.push(n); } } comps.push({ type: t, mem }); }
  for(let k = 0; k < st.length; k++) if(lab[k] < 0 && (st[k] === 'rem' || st[k] === 'add') && !nb(k).some(n => lab[n] >= 0)) grow(k, st[k], s => s === st[k]);
  // 2) الخلايا الضعيفة وخلايا "تغيّر" الملاصقة لمنطقة نقص/إضافة تُضم إليها
  for(let pass = 0; pass < 2; pass++) for(let k = 0; k < st.length; k++) if(lab[k] < 0 && st[k] !== 'same' && st[k] !== 'out'){ const n = nb(k).find(n => lab[n] >= 0); if(n !== undefined){ lab[k] = lab[n]; comps[lab[n]].mem.push(k); } }
  // 3) مناطق التبديل المستقلة
  for(let k = 0; k < st.length; k++) if(lab[k] < 0 && st[k] === 'chg') grow(k, 'chg', s => s === 'chg');
  const regions = [];
  for(const c of comps){

    try{ const c = toCanvas(await loadImg(f), 800); if(await Store.set('displays', rid(), { name, section, base: jpeg(c), baseTs: Date.now(), open: [], created: Date.now(), lastCheck: Date.now() })) toast('أُضيفت العارضة. افحصها لاحقاً للمقارنة.'); S.tab = 'disp'; rf(); }catch(e){ toast('تعذّرت قراءة الصورة.'); }
  },
  dispSheet(dd){ const d = S.displays.find(x => x.id === dd.id); if(!d) return;
    openModal(`<h2>${esc(d.name)}</h2><img src="${esc(d.base)}" style="width:100%;border-radius:10px"><div class="xs mut" style="margin:4px 0 10px">آخر صورة معتمدة ${ago(d.baseTs)} · ${(d.open || []).length} نقص مفتوح</div>
      <button class="btn pri w" data-act="startCheck" data-id="${d.id}">${ic('cam')} فحص الآن</button><div style="height:8px"></div><button class="btn dan w" data-act="delDisp" data-id="${d.id}">حذف العارضة</button>`); },
  delDisp(d){ if(!d.ok) return openModal(`<h2>حذف العارضة</h2><p>حذفها نهائياً؟ السجلات تبقى.</p><div class="g2"><button class="btn dan" data-act="delDisp" data-id="${d.id}" data-ok="1">حذف</button><button class="btn" data-act="close">إلغاء</button></div>`); Store.del('displays', d.id); closeModal(); },
  startCheck(d){ closeModal(); S.chk = { did: d.id }; S.tab = 'check'; rf(); window.scrollTo(0, 0); },
  cancelCheck(){ S.chk = null; rf(); },
  cmode(d){ S.cmode = d.v; LS.set('sh_cmode', d.v); rf(); },
  takeCur(){ takeCur(); },
  aiName(){ aiName(); },
  ign(d){ const r = S.chk.res.regions[+d.i]; r.ign = !r.ign; rf(); },
  saveCheck(){ saveCheck(); },
  evSheet(d){ const e = S.events.find(x => x.id === d.id); if(!e) return;
    openModal(`<h2>${esc(evName(e))}</h2><div class="sm mut">${esc(e.dName)} · ${ago(e.ts)}${e.by ? ' · ' + esc(e.by) : ''}</div>
      <div class="g2" style="margin:10px 0"><div>${e.thumbB ? `<img src="${esc(e.thumbB)}" style="width:100%;border-radius:8px">` : ''}<div class="xs mut">قبل</div></div><div>${e.thumbA ? `<img src="${esc(e.thumbA)}" style="width:100%;border-radius:8px">` : ''}<div class="xs mut">بعد</div></div></div>
      ${e.type === 'missing' ? `<div class="row">${e.status === 'restocked' ? `<span class="tag t-ok">عُوّض بعد ${dur(e.restockedAt - e.ts)}</span>` : '<span class="tag t-wa">بانتظار التعويض</span>'}<span class="tag ${(reasonTxt[e.reason] || reasonTxt.pending)[1]}">${(reasonTxt[e.reason] || reasonTxt.pending)[0]}</span></div>
      <div class="fld"><label>سبب النقص</label><div class="g3"><button class="btn sm" data-act="setReason" data-id="${e.id}" data-v="sold">مُباع</button><button class="btn sm" data-act="setReason" data-id="${e.id}" data-v="moved">منقول</button><button class="btn sm dan" data-act="setReason" data-id="${e.id}" data-v="unknown">غير معروف</button></div></div>
      ${e.status === 'open' ? `<button class="btn w" data-act="manualRestock" data-id="${e.id}">${ic('check')} تم التعويض يدوياً</button>` : ''}` : ''}`); },
  async setReason(d){ if(await Store.update('events', d.id, { reason: d.v, reasonBy: S.user || '', reasonAt: Date.now() })){ closeModal(); toast(d.v === 'unknown' ? 'أُحيل كاختفاء غير مبرر.' : 'تم الحفظ.'); } },
  async manualRestock(d){ const e = S.events.find(x => x.id === d.id); if(!e) return; await Store.update('events', e.id, { status: 'restocked', restockedAt: Date.now(), restockedBy: S.user || '' });
    const disp = S.displays.find(x => x.id === e.display); if(disp) await Store.update('displays', disp.id, { open: (disp.open || []).filter(o => o.ev !== e.id) }); closeModal(); },
  saleForm(){ if(!S.displays.length) return toast('أضف عارضة أولاً.');
    openModal(`<h2>تسجيل بيع</h2><div class="fld"><label>العارضة</label><select id="slD">${S.displays.map(d => `<option value="${d.id}">${esc(d.name)}</option>`).join('')}</select></div><div class="fld"><label>المنتج (اختياري)</label><input id="slN" placeholder="مثال: Galaxy S25"></div><div class="fld"><label>عدد القطع</label><input id="slQ" inputmode="numeric" value="1"></div><button class="btn pri w" data-act="saleSave">تسجيل</button>`); },
  async saleSave(){
    const did = $('#slD').value, note = $('#slN').value.trim(), q = Math.max(1, Math.min(20, +$('#slQ').value || 1)); let m = 0;
    // البيع المسجّل بعد رصد النقص يبرّر أقدم نقص معلّق في العارضة نفسها
    const pend = S.events.filter(e => e.type === 'missing' && e.display === did && e.reason === 'pending').sort((a, b) => a.ts - b.ts);
    for(let i = 0; i < q; i++){ const id = rid(), ev = pend.shift();
      await Store.set('sales', id, { display: did, note, ts: Date.now() + i, used: !!ev, event: ev ? ev.id : '', by: S.user || '' });
      if(ev){ await Store.update('events', ev.id, { reason: 'sold', saleId: id, name: ev.name || note }); m++; } }
    closeModal(); toast(m ? `سُجّل البيع وبُرّر ${m} نقص معلّق.` : 'سُجّل البيع.');
  },
  delSale(d){ Store.del('sales', d.id); }
};
document.addEventListener('click', e => { const el = e.target.closest('[data-act]'); if(!el || el.tagName === 'SELECT') return; const fn = A[el.dataset.act]; if(!fn) return; e.preventDefault(); fn(el.dataset, el, e); });

render();
Store.init().then(() => {
  let n = 3; const done = () => { if(--n <= 0 && !S.ready){ S.ready = true; rf(); } };
  setTimeout(() => { if(!S.ready){ S.ready = true; rf(); } }, 10000);
  const once = f => { let x = false; return () => { if(!x){ x = true; f(); } }; }, d1 = once(done), d2 = once(done), d3 = once(done);
  Store.listen('displays', null, null, a => { if(a) S.displays = a.sort((x, y) => (x.created || 0) - (y.created || 0)); d1(); sched(); });
  Store.listen('events', null, { order: ['ts', 'desc'], limit: 400 }, a => { if(a) S.events = a; d2(); sched(); });
  Store.listen('sales', ['used', '==', false], null, a => { if(a) S.sales = a.sort((x, y) => y.ts - x.ts); d3(); sched(); });
});
</script>
</body>
