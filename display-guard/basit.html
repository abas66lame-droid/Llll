<style>

.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on::after{right:21px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}.li:last-child{border:0}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}

.src button b{display:block;font-size:15px;margin-bottom:4px}.src button.on{border-color:var(--pri);background:var(--pril)}

<script>
"use strict";
/* DETECTOR_START */
// ===================== محرك كشف التغيّر (منقول من نسخة بايثون) =====================
const DET = (() => {
  function frameFromCanvas(c){
    const w = c.width, h = c.height, d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, w, h).data, n = w * h;
    const raw = new Float32Array(n), ca = new Float32Array(n), cb = new Float32Array(n);
    for(let i = 0, j = 0; i < n; i++, j += 4){ const R = d[j], G = d[j + 1], B = d[j + 2]; raw[i] = 0.299 * R + 0.587 * G + 0.114 * B; ca[i] = R - G; cb[i] = (R + G) / 2 - B; }
    return build(raw, ca, cb, w, h);
  }
  function build(raw, ca, cb, w, h){
    const g = new Float32Array(w * h);
    for(let y = 0; y < h; y++){ const y0 = y > 0 ? y - 1 : 0, y1 = y < h - 1 ? y + 1 : h - 1;
      for(let x = 0; x < w; x++){ const x0 = x > 0 ? x - 1 : 0, x1 = x < w - 1 ? x + 1 : w - 1;
        g[y * w + x] = (raw[y0 * w + x0] + raw[y0 * w + x] + raw[y0 * w + x1] + raw[y * w + x0] + raw[y * w + x] + raw[y * w + x1] + raw[y1 * w + x0] + raw[y1 * w + x] + raw[y1 * w + x1]) / 9; } }
    const G = grad(g, w, h), W1 = w + 1, I = new Float64Array(W1 * (h + 1));
    for(let y = 0; y < h; y++){ let row = 0; for(let x = 0; x < w; x++){ row += g[y * w + x]; I[(y + 1) * W1 + x + 1] = I[y * W1 + x + 1] + row; } }
    return { w, h, g, ca, cb, G, I };
  }
  function grad(g, w, h){
    const o = new Float32Array(w * h);
    for(let y = 1; y < h - 1; y++) for(let x = 1; x < w - 1; x++){ const i = y * w + x, gx = g[i + 1] - g[i - 1], gy = g[i + w] - g[i - w]; o[i] = Math.sqrt(gx * gx + gy * gy); }
    return o;
  }
  function clone(F){ return { w: F.w, h: F.h, g: F.g.slice(), ca: F.ca.slice(), cb: F.cb.slice(), G: F.G.slice(), I: F.I.slice() }; }
  // اهتزاز الكاميرا: إزاحة صغيرة بدقة ربع الصورة
  function estimateShift(ref, cur){
    const w4 = Math.floor(ref.w / 4), h4 = Math.floor(ref.h / 4), a = new Float32Array(w4 * h4), b = new Float32Array(w4 * h4);
    for(let y = 0; y < h4; y++) for(let x = 0; x < w4; x++){ a[y * w4 + x] = ref.g[y * 4 * ref.w + x * 4]; b[y * w4 + x] = cur.g[y * 4 * cur.w + x * 4]; }
    const ga = grad(a, w4, h4), gb = grad(b, w4, h4), m = 5;
    let best = -2, bd = [0, 0];
    for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){
      let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
      for(let y = m; y < h4 - m; y++) for(let x = m; x < w4 - m; x++){ const A = ga[y * w4 + x], B = gb[(y + dy) * w4 + x + dx]; n++; sa += A; sb += B; saa += A * A; sbb += B * B; sab += A * B; }
      const va = saa - sa * sa / n, vb = sbb - sb * sb / n, c = va > 0 && vb > 0 ? (sab - sa * sb / n) / Math.sqrt(va * vb) : 0;
      if(c > best){ best = c; bd = [dx * 4, dy * 4]; }
    }
    return bd;
  }
  // محاذاة خاصة بكل منطقة: تغيير التركيز في كاميرا الموبايل يقرّب الصورة قليلاً فتنزاح أجزاؤها بمقادير مختلفة
  function zoneShift(ref, cur, z, base){
    const W = ref.w, H = ref.h, x0 = Math.max(14, Math.floor(z.x * W)), y0 = Math.max(14, Math.floor(z.y * H)), x1 = Math.min(W - 14, Math.ceil((z.x + z.w) * W)), y1 = Math.min(H - 14, Math.ceil((z.y + z.h) * H));
    const score = (dx, dy) => { let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
      for(let y = y0; y < y1; y += 2){ const yy = y + dy; if(yy < 0 || yy >= H) continue; for(let x = x0; x < x1; x += 2){ const xx = x + dx; if(xx < 0 || xx >= W) continue;
        const A = ref.G[y * W + x], B = cur.G[yy * W + xx]; n++; sa += A; sb += B; saa += A * A; sbb += B * B; sab += A * B; } }
      const va = saa - sa * sa / n, vb = sbb - sb * sb / n; return n > 50 && va > 0 && vb > 0 ? (sab - sa * sb / n) / Math.sqrt(va * vb) : -1; };
    let best = score(base[0], base[1]), bd = base.slice();
    for(let dy = -12; dy <= 12; dy += 3) for(let dx = -12; dx <= 12; dx += 3){ const s = score(dx, dy); if(s > best + 1e-6){ best = s; bd = [dx, dy]; } }
    const c = bd.slice(); for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++){ if(!dx && !dy) continue; const s = score(c[0] + dx, c[1] + dy); if(s > best + 1e-6){ best = s; bd = [c[0] + dx, c[1] + dy]; } }
    return bd;
  }
  // حركة الكاميرا الكاملة (إزاحة + دوران + تقريب): نقيس إزاحة 48 رقعة موزعة على الصورة (من الخشن للدقيق حتى لا تخدعنا
  // الأنماط المتكررة مثل أزرار الكيبورد) ثم نطابقها بتحويل أفيني بطريقة RANSAC (تستبعد الرقع الشاذة مثل مكان قطعة مشالة).
  // يرجع {a,b,c,d,e,f}: u = a·x + c·y + e ، v = b·x + d·y + f (بالبكسل، من المرجع إلى الحالي)، أو null إذا تعذّر القياس بثقة
  function estimateAffine(ref, cur, base){
    const W = ref.w, H = ref.h, w4 = Math.floor(W / 4), h4 = Math.floor(H / 4);
    const down = F => { const o = new Float32Array(w4 * h4);
      for(let y = 0; y < h4; y++) for(let x = 0; x < w4; x++){ let t = 0; for(let yy = 0; yy < 4; yy++){ const r = (y * 4 + yy) * W + x * 4; t += F.g[r] + F.g[r + 1] + F.g[r + 2] + F.g[r + 3]; } o[y * w4 + x] = t / 16; }
      return grad(o, w4, h4); };
    const A4 = down(ref), B4 = down(cur);
    const ncc = (A, B, w, h, x0, y0, x1, y1, dx, dy, st) => { let n = 0, sa = 0, sb = 0, saa = 0, sbb = 0, sab = 0;
      for(let y = y0; y < y1; y += st){ const yy = y + dy; if(yy < 1 || yy >= h - 1) continue; for(let x = x0; x < x1; x += st){ const xx = x + dx; if(xx < 1 || xx >= w - 1) continue;
        const a = A[y * w + x], b = B[yy * w + xx]; n++; sa += a; sb += b; saa += a * a; sbb += b * b; sab += a * b; } }
      const va = saa - sa * sa / n, vb = sbb - sb * sb / n; return n > 40 && va > n * 2 && vb > 0 ? (sab - sa * sb / n) / Math.sqrt(va * vb) : -1; };
    const NX = 8, NY = 6, pts = [], b4 = [Math.round(base[0] / 4), Math.round(base[1] / 4)];
    for(let j = 0; j < NY; j++) for(let i = 0; i < NX; i++){
      const x0 = Math.round(i * w4 / NX), x1 = Math.round((i + 1) * w4 / NX), y0 = Math.round(j * h4 / NY), y1 = Math.round((j + 1) * h4 / NY);
      let best = -1, bd = b4;
      for(let dy = -8; dy <= 8; dy++) for(let dx = -8; dx <= 8; dx++){ const s = ncc(A4, B4, w4, h4, x0, y0, x1, y1, b4[0] + dx, b4[1] + dy, 1); if(s > best){ best = s; bd = [b4[0] + dx, b4[1] + dy]; } }

function embCrop(src, b){

// صورة رمادية صغيرة (16 خانة عرضاً) لمكان الحالة قبل الشيل: عند الإرجاع نقارن المكان كله بما كان، فإن بقي جزء مختلف لم يرجع كل شيء
function grayThumb(src, b){
  try{ const W = src.width, H = src.height, m = 0.04, gw = 16, gh = Math.max(4, Math.round(gw * (b.h * H) / Math.max(1, b.w * W)));
    const c = document.createElement('canvas'); c.width = gw; c.height = gh; const x = c.getContext('2d', { willReadFrequently: true });
    x.drawImage(src, (b.x + b.w * m) * W, (b.y + b.h * m) * H, b.w * (1 - 2 * m) * W, b.h * (1 - 2 * m) * H, 0, 0, gw, gh);
    const d = x.getImageData(0, 0, gw, gh).data, g = []; for(let i = 0; i < d.length; i += 4) g.push(0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2]);

    return g.map(v => Math.round((v - mu) / sd * 100) / 100);
  }catch(e){ return null; }
}
const thumbDiff = (a, b) => { let n = 0; for(let i = 0; i < a.length; i++) if(Math.abs(a[i] - b[i]) > 1) n++; return n / a.length; };
function rot180(src, b){ const W = src.width, H = src.height, c = document.createElement('canvas'); c.width = Math.max(1, Math.round(b.w * W)); c.height = Math.max(1, Math.round(b.h * H));
  const x = c.getContext('2d'); x.translate(c.width, c.height); x.rotate(Math.PI); x.drawImage(src, b.x * W, b.y * H, b.w * W, b.h * H, 0, 0, c.width, c.height); return c; }
const embSim = (a, b) => { let d = 0, na = 0, nb = 0; for(let i = 0; i < a.length; i++){ d += a[i] * b[i]; na += a[i] * a[i]; nb += b[i] * b[i]; } return na && nb ? d / Math.sqrt(na * nb) : 0; };

// يرجع مربعات الأيادي والأشخاص (نسب 0..1) في الصورة
function mpPeople(c){
  if(MP.state !== 'ready') return [];
  const t0 = performance.now(), out = [], W = c.width, H = c.height;
  try{
    const r = MP.obj.detect(c);
    for(const d of r.detections || []){ const k = d.categories && d.categories[0], b = d.boundingBox; if(!k || !b || k.categoryName !== 'person') continue;

  }catch(e){}

    try{
      const r = MP.hand.recognize ? MP.hand.recognize(c) : MP.hand.detect(c);
      for(const lm of r.landmarks || []){ let l = 1, t = 1, rr = 0, b = 0; for(const q of lm){ l = Math.min(l, q.x); t = Math.min(t, q.y); rr = Math.max(rr, q.x); b = Math.max(b, q.y); }

    }catch(e){}
  }

}

/* =================== المحرك =================== */
const ENG = {
  base: null, prev: null, baseCv: null, zst: {},
  camMove: 0, camBump: 0, settle: 0, hb: null, blindSince: 0, blindEv: null,
  reset(){ this.base = null; this.prev = null; this.baseCv = null; this.zst = {}; this.camMove = 0; this.camBump = 0; this.settle = 0; this.hb = null; this.blindSince = 0; this.blindEv = null; S.moving = {}; S.diag = {}; S.camState = 'ok'; },
  rebaseAll(F, c){ this.base = DET.clone(F); this.baseCv.getContext('2d').drawImage(c, 0, 0); this.zst = {}; this.hb = DET.health(F); },
  // قبل إعادة ضبط المرجع كاملاً (بعد حركة الكاميرا): نقارن كل عارضة بالمرجع القديم بعد محاذاته بالإزاحة المقاسة،
  // حتى لا تُخفى سرقة حدثت مع حركة الموبايل (دفعه وأخذ القطعة في نفس اللحظة). نفتح فقط حالات «نقص» واضحة، ونغلق ما رجع.
  realign(F, c, sh, ppl, night, gb){
    let n = 0;
    const grow = (b, m) => ({ x: b.x - b.w * m, y: b.y - b.h * m, w: b.w * (1 + 2 * m), h: b.h * (1 + 2 * m) });
    // نطابق المرجع القديم على الصورة الحالية (إزاحة + دوران + تقريب). إذا تعذّر القياس بثقة لا نفتح حالات (تفادياً للإنذار الكاذب)
    const T = DET.estimateAffine(this.base, F, sh);
    if(!T){ if(gb > 0.5) this.newTamper('turn', c); this.rebaseAll(F, c); return 0; } // المشهد كله تغيّر ولا يمكن مطابقته: الكاميرا وُجّهت لمكان آخر
    const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height;
    const wx = wc.getContext('2d', { willReadFrequently: true }); wx.drawImage(c, 0, 0); wx.setTransform(T.a, T.b, T.c, T.d, T.e, T.f); wx.drawImage(this.baseCv, 0, 0); wx.setTransform(1, 0, 0, 1, 0, 0);
    const B = DET.frameFromCanvas(wc);
    // نفس قرار المراقبة العادي (يد، نقل، إضافة، شيل) على المرجع بعد مطابقته — حتى لا يضيع نقلٌ أو إضافة حدثا أثناء حركة الكاميرا أو لمس الشاشة
    const old = this.base, cands = [], before = S.events.length; this.base = B;
    for(const z of S.zones){
      const r = DET.compareZone(B, F, z, [0, 0], { fine: fineOf(z) });
      if(r.changed > 0.5) continue; // تغيّر شامل للعارضة بعد الحركة: لا نستطيع الحكم بثقة
      const opened = S.events.filter(e => e.zone === z.id && e.kind !== 'conceal' && (e.status === 'pending' || e.status === 'incident'));
      for(const cd of mergeCands(mergeNear(r.regions, 0.04).map(reg => this.cand(z, reg, F, [0, 0], now() - 60)), reg => this.cand(z, reg, F, [0, 0], now() - 60))){
        const reg = cd.reg; if((ppl || []).some(b => ix(grow(b, 0.08), grow(reg, 0.1)))) continue;
        const m = opened.filter(e => DET.overlap(reg, e.box) > 0.35 && (!e.sig || DET.sigSim(e.sig, cd.after) >= MOVE_SIM_HAND));
        if(m.length){ m.forEach(e => this.returned(e, c, reg)); continue; }
        if(reg.type === 'rem' && opened.some(e => DET.overlap(reg, e.box) > 0.5)) continue;
        cands.push(cd);
      }
    }
    this.decide(cands, c, night); this.base = old;
    n = S.events.slice(0, S.events.length - before).filter(e => e.kind === 'removal' || e.kind === 'night').length;
    this.rebaseAll(F, c);
    return n;
  },
  process(c, pplFn){
    // كشف الأشخاص والأيادي (MediaPipe) مكلف: لا نشغّله إلا عند الحاجة (حركة، أو تغيّر، أو شخص كان موجوداً) ومرة واحدة لكل قراءة
    let pc = null; const P = () => pc || (pc = typeof pplFn === 'function' ? (S.mpCalls = (S.mpCalls || 0) + 1, pplFn() || []) : (pplFn || []));
    const F = DET.frameFromCanvas(c);
    if(!this.base || this.base.w !== F.w || this.base.h !== F.h){
      S.liveSince = now(); this.hb = DET.health(F); this.base = DET.clone(F); this.prev = F; this.baseCv = document.createElement('canvas'); this.baseCv.width = c.width; this.baseCv.height = c.height; this.baseCv.getContext('2d').drawImage(c, 0, 0); return;
    }
    const sh = DET.estimateShift(this.base, F), night = isNight(), FULL = { x: 0, y: 0, w: 1, h: 1 };
    // 0) لمس الشاشة يحرّك الموبايل: نوقف الحكم حتى يثبت، ثم نعيد الضبط تلقائياً
    if(now() - (S.touchAt || 0) < 2.5){ S.camState = 'touch'; S.zones.forEach(z => S.diag[z.id] = { state: 'touch' }); this.settle = 2; this.prev = F; return; }
    // العبث: العدسة مغطاة أو الصورة مظلمة. لا نحكم ولا نعيد ضبط المرجع (حتى لا تُخفى سرقة تحت الغطاء)،
    // وعند رجوع الرؤية نقارن بالمرجع القديم (عبر التثبيت ثم realign). التغطية أطول من المهلة = تنبيه، إلا الظلام ليلاً (إطفاء الأضواء)
    const hl = DET.health(F), hb = this.hb || hl;
    if(hl.tex < Math.max(1.5, 0.3 * hb.tex) || hl.mu < 12){
      const t = now(); if(!this.blindSince) this.blindSince = t;
      S.camState = 'blind'; S.zones.forEach(z => S.diag[z.id] = { state: 'blind' });
      if(!this.blindEv && !(night && hl.mu < 12) && t - this.blindSince >= blindSec()) this.blindEv = this.newTamper('cover', c);
      this.settle = Math.max(this.settle, 2); this.prev = F; return;
    }
    if(this.blindSince){
      const e = this.blindEv; if(e){ e.img_r = this.shot(c, { x: 0, y: 0, w: 1, h: 1 }, '#38a169'); e.t_end = now(); e.note = (e.note + ' عادت الرؤية بعد ' + Math.round(now() - this.blindSince) + ' ثانية.').trim(); putEvent(e); }
      this.blindSince = 0; this.blindEv = null;
    }
    // 1) هل الكاميرا نفسها تتحرك الآن؟
    const gm = DET.motion(this.prev, F, FULL)[0];
    if(gm > 0.45){ this.camMove++; S.camState = 'moving'; S.zones.forEach(z => S.diag[z.id] = { state: 'camera' }); this.settle = Math.max(this.settle, 2); this.prev = F; return; }
    this.camMove = 0;
    // 2) بعد اللمس أو الاهتزاز: ننتظر قراءتين مستقرتين ثم نعتمد الصورة الحالية مرجعاً (إذا تغيّرت الصورة عموماً)
    if(this.settle > 0){
      S.camState = 'settle'; S.zones.forEach(z => S.diag[z.id] = { state: 'settle' });
      if(gm < 0.03 && --this.settle === 0){ const gb = DET.motion(this.base, F, FULL)[0]; if(gb > 0.04){ const n = this.realign(F, c, sh, P(), night, gb); toast(n ? 'تحرك الموبايل؛ أُعيد ضبط الصورة، ورُصد نقص في ' + n + ' موضع' : 'تحرك الموبايل؛ أُعيد ضبط الصورة تلقائياً', 3500); } S.camState = 'ok'; }
      this.prev = F; return;
    }

  zoneIdx(i){ const [x, y] = this.slots[i]; return (x < 640 ? 0 : 1) + (y < 300 ? 0 : 2); }

/* =================== بصمة العارضة (Stand Fingerprint) ===================
   تحفظ bصمة بصرية مختصرة (histogram 64×RGB) لكل عارضة في localStorage.
   عند بدء الكاميرا تُقارن الصورة بالبصمات المحفوظة وتُرشّح المناطق تلقائياً.
   كل عارضة تحتفظ ببصمتها المستقلة؛ تقدر تضيف عارضات أخرى طبيعي.
================================================================== */
const STAND = {
  BINS: 16, // 16 bin لكل قناة RGB = 48 قيمة
  _key: 'haris_stands_v1',

  load(){ try{ return JSON.parse(localStorage.getItem(this._key) || '[]'); }catch(e){ return []; } },
  save(list){ try{ localStorage.setItem(this._key, JSON.stringify(list)); }catch(e){} },

  // احسب بصمة صورة (canvas أو ImageData)
  fingerprint(cv){
    const ctx = cv.getContext('2d', { willReadFrequently: true });
    const W = cv.width, H = cv.height;
    const im = ctx.getImageData(0, 0, W, H).data;
    const B = this.BINS, hist = new Float32Array(B * 3);
    for(let i = 0; i < im.length; i += 4){
      hist[Math.floor(im[i]   * B / 256)]       += 1;
      hist[B + Math.floor(im[i+1] * B / 256)]   += 1;
      hist[B*2 + Math.floor(im[i+2] * B / 256)] += 1;
    }
    const n = W * H;
    for(let i = 0; i < hist.length; i++) hist[i] /= n;
    return Array.from(hist);
  },

  // تشابه بصمتين (cosine)
  sim(a, b){
    let dot = 0, na = 0, nb = 0;
    for(let i = 0; i < a.length; i++){ dot += a[i]*b[i]; na += a[i]*a[i]; nb += b[i]*b[i]; }
    return na && nb ? dot / Math.sqrt(na * nb) : 0;
  },

  // احفظ بصمة العارضة الحالية باسم
  saveStand(name, cv){
    const fp = this.fingerprint(cv);
    const list = this.load().filter(s => s.name !== name);
    list.push({ name, fp, ref: this.thumb(cv), zones: JSON.parse(JSON.stringify(S.zones)), saved: now() });
    this.save(list);
    return list;
  },

  // ابحث عن أقرب عارضة محفوظة للصورة الحالية
  match(cv, threshold = 0.92){
    const fp = this.fingerprint(cv);
    const list = this.load();
    let best = null, bestSim = 0;
    for(const s of list){
      const sc = this.sim(fp, s.fp);
      if(sc > bestSim){ bestSim = sc; best = s; }
    }
    return bestSim >= threshold ? { stand: best, sim: bestSim } : null;
  },

  // تحقق تلقائياً عند بدء الكاميرا وحمّل مناطق العارضة المعروفة
  autoDetect(cv){
    const r = this.match(cv);
    if(!r) return null;
    return r;
  },

  list(){ return this.load(); },
  delete(name){ this.save(this.load().filter(s => s.name !== name)); },

  // حمّل مناطق العارضة المتعرَّف عليها وأعد الضبط
  // صورة مصغّرة رمادية بعرض 96 (بايت لكل نقطة، base64) لمعرفة أين صارت العارضة لاحقاً
  TW: 96,
  thumb(cv){
    const d = cv.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, cv.width, cv.height).data, n = cv.width * cv.height, g = new Float32Array(n);
    for(let i = 0, j = 0; i < n; i++, j += 4) g[i] = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
    const th = Math.round(this.TW * cv.height / cv.width), t = DET.resize(g, cv.width, cv.height, this.TW, th);
    let b = ''; for(const v of t) b += String.fromCharCode(Math.round(v));
    return { w: this.TW, h: th, g: btoa(b) };
  },
  unthumb(r){ const b = atob(r.g), t = new Float32Array(b.length); for(let i = 0; i < b.length; i++) t[i] = b.charCodeAt(i); return t; },
  applyStand(stand, cv){
    if(!stand.zones || !stand.zones.length){
      toast(`🏪 عارضة «${stand.name}» — لا توجد مناطق محفوظة، ارسمها يدوياً`, 5000);
      return;
    }
    let zones = stand.zones;
    // الموبايل قد لا يكون في نفس مكانه وقت الحفظ: ننقل المناطق إلى مكان العارضة الآن
    if(stand.ref && cv){
      const cur = this.thumb(cv), T = DET.alignThumb(this.unthumb(stand.ref), stand.ref.w, stand.ref.h, this.unthumb(cur), cur.w, cur.h);
      if(!T || T.score < 0.5){ toast(`🏪 عرفت العارضة «${stand.name}» لكن لم أستطع تحديد مكان رفوفها في هذه اللقطة — ارسم المناطق يدوياً`, 6000); return; }
      zones = zones.map(z => DET.mapZone(z, T, stand.ref.w, stand.ref.h, cur.w, cur.h));
    }
    // أعطِ كل منطقة id جديد حتى لا تتعارض مع مناطق قديمة
    const newZones = zones.map(z => ({ ...z, id: Math.random().toString(36).slice(2,10) }));
    S.zones = newZones;
    saveZones();
    ENG.reset();
    toast(`✅ عارضة «${stand.name}» — حُمِّلت ${newZones.length} منطقة تلقائياً، بدأت المراقبة`, 5000);
    render();
  },
};

    <div class="editor" id="ed"><canvas id="edimg"></canvas><canvas class="ov" id="edov"></canvas></div>` : `<div class="card empty">ابدأ مصدر الفيديو من «المراقبة» أولاً حتى تظهر الصورة.<div style="height:10px"></div><button class="btn pri" onclick="go('mon')">المراقبة</button></div>`}
    <div class="card">${S.zones.map(z => `<div class="li"><b class="sp">${esc(z.name)}</b><span class="sm mut">${esc(z.section || '')}</span><button class="btn sm" onclick="zoneForm('${z.id}')">تعديل</button><button class="btn sm dan" onclick="confirmBox('حذف هذه المنطقة؟',()=>{S.zones=S.zones.filter(x=>x.id!=='${z.id}');saveZones();render()})">حذف</button></div>`).join('') || '<div class="empty">لا توجد مناطق.</div>'}</div>`;

function takeSnap(){ const c = grabFrame(); if(!c) return; S.snap = document.createElement('canvas'); S.snap.width = c.width; S.snap.height = c.height; S.snap.getContext('2d').drawImage(c, 0, 0); }
function mountZones(){
  if(!S.src) return;
  if(!S.snap) takeSnap();
  drawEd();
  const cv = $('#edov'); if(!cv) return;
  const pos = e => { const r = cv.getBoundingClientRect(); return [Math.max(0, Math.min(1, (e.clientX - r.left) / r.width)), Math.max(0, Math.min(1, (e.clientY - r.top) / r.height))]; };
  cv.onpointerdown = e => { const [x, y] = pos(e); S.drawing = { x0: x, y0: y, x1: x, y1: y }; cv.setPointerCapture(e.pointerId); };
  cv.onpointermove = e => { if(!S.drawing) return; const [x, y] = pos(e); S.drawing.x1 = x; S.drawing.y1 = y; drawEd(); };
  cv.onpointerup = () => { const d = S.drawing; if(!d) return; S.drawing = null; const r = { x: Math.min(d.x0, d.x1), y: Math.min(d.y0, d.y1), w: Math.abs(d.x1 - d.x0), h: Math.abs(d.y1 - d.y0) };
    if(r.w > 0.02 && r.h > 0.02) zoneForm(null, r); else { const z = S.zones.find(z => r.x >= z.x && r.x <= z.x + z.w && r.y >= z.y && r.y <= z.y + z.h); if(z) zoneForm(z.id); } drawEd(); };
}
function drawEd(){
  const im = $('#edimg'), ov = $('#edov'); if(!im || !S.snap) return;

  ov.width = S.snap.width; ov.height = S.snap.height; const x = ov.getContext('2d'), W = ov.width, H = ov.height;

/* ----- التقارير ----- */
function report(days = 14){
  const out = [], today = new Date(); today.setHours(0, 0, 0, 0);
  for(let i = days - 1; i >= 0; i--){
    const a = today.getTime() / 1000 - i * 86400, b = a + 86400, R = S.events.filter(e => (e.kind === 'removal' || e.kind === 'night') && e.t_start >= a && e.t_start < b);
    out.push({ day: new Date(a * 1000).toLocaleDateString('en-CA'), removals: R.length, returned: R.filter(e => e.status === 'returned').length, sold: R.filter(e => e.status === 'sold' || e.resolution === 'sold').length,
      incidents: R.filter(e => e.status === 'incident' || e.status === 'resolved').length, theft: R.filter(e => e.resolution === 'theft').length, false: R.filter(e => e.resolution === 'false').length, late: R.filter(e => e.resolution === 'returned').length });
  }
  return out;
}
function vRep(){
  const D = report(), T = D.reduce((a, d) => { for(const k in d) if(k !== 'day') a[k] = (a[k] || 0) + d[k]; return a; }, {});
  const since = now() - 14 * 86400, zm = {};
  S.events.filter(e => (e.kind === 'removal' || e.kind === 'night') && e.t_start >= since).forEach(e => { const o = zm[e.zone] = zm[e.zone] || { total: 0, inc: 0, theft: 0 }; o.total++; if(e.status === 'incident' || e.status === 'resolved') o.inc++; if(e.resolution === 'theft') o.theft++; });
  const Z = Object.entries(zm).sort((a, b) => b[1].inc - a[1].inc || b[1].total - a[1].total);
  return `<h2>التقارير — آخر 14 يوماً</h2><div class="kpis">${[['حالات شيل', T.removals], ['رجعت خلال المهلة', T.returned], ['مُباعة', T.sold], ['تنبيهات', T.incidents], ['رجعت بعد التنبيه', T.late], ['سرقة مؤكدة', T.theft], ['خطأ في الكشف', T.false]].map(([l, n]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${n || 0}</div></div>`).join('')}</div>
    <div class="card"><h3>يومياً</h3><div class="tw"><table><tr><th>اليوم</th><th>شيل</th><th>رجع</th><th>مُباع</th><th>تنبيه</th><th>سرقة مؤكدة</th><th style="width:40%">التوزيع</th></tr>${D.slice().reverse().map(d => { const t = Math.max(1, d.removals);
      return `<tr><td>${d.day}</td><td>${d.removals}</td><td>${d.returned}</td><td>${d.sold}</td><td>${d.incidents}</td><td>${d.theft}</td><td><div class="bar"><i style="width:${100 * d.returned / t}%;background:#38a169"></i><i style="width:${100 * d.sold / t}%;background:#2d5bb5"></i><i style="width:${100 * d.incidents / t}%;background:#c53030"></i></div></td></tr>`; }).join('')}</table></div>
    <div class="xs mut" style="margin-top:6px">أخضر: رجع · أزرق: مُباع · أحمر: تنبيه</div></div>
    <div class="card"><h3>العارضات الأكثر تنبيهات</h3><div class="tw"><table><tr><th>العارضة</th><th>القسم</th><th>تفاعلات (14 يوم)</th><th>حالات الشيل</th><th>تنبيهات</th><th>سرقة مؤكدة</th></tr>${Z.map(([id, o]) => { const z = zoneOf(id), I = LS.get('haris_inter', {}), it = Object.values(I).reduce((a, d) => a + (d[id] || 0), 0); return `<tr><td>${esc(z.name)}</td><td>${esc(z.section || '')}</td><td>${it}</td><td>${o.total}</td><td>${o.inc}</td><td>${o.theft}</td></tr>`; }).join('') || '<tr><td colspan="5" class="mut">لا توجد بيانات</td></tr>'}</table></div>
    <div class="row" style="margin-top:10px"><button class="btn" onclick="exportCsv()">تنزيل سجل الأحداث (CSV)</button></div></div>${vStockRep(since)}`;
}
// رفوف البضاعة المتكررة: الالتقاطات مقابل المبيعات المسجّلة لنفس الرف. الفرق الكبير المستمر = بضاعة تخرج بلا بيع
function vStockRep(since){
  const Z = S.zones.filter(z => z.mode === 'stock'); if(!Z.length) return '';
  const rows = Z.map(z => { const E = S.events.filter(e => e.zone === z.id && e.t_start >= since), pk = E.filter(e => e.kind === 'pick' || e.kind === 'removal' || e.kind === 'night').length, rs = E.filter(e => e.kind === 'restock').length, cn = E.filter(e => e.kind === 'conceal').length;
    const sl = S.sales.filter(x => x.zone === z.id && x.t >= since).reduce((a, x) => a + x.qty, 0); return { z, pk, rs, cn, sl, gap: Math.max(0, pk - sl) }; }).sort((a, b) => (b.sl ? b.gap : 0) - (a.sl ? a.gap : 0) || b.cn - a.cn || b.pk - a.pk);
  return `<div class="card"><h3>رفوف البضاعة: الالتقاطات مقابل المبيعات</h3><p class="sm mut" style="margin-top:0">«التقاط» يعني أن قطعة أُخذت من مقدمة صف، <b>وليس سرقة</b>: أغلب الالتقاطات زبائن يشترون. المقارنة تصبح مفيدة فقط إذا سُجّلت مبيعات الرف (مجموع اليوم من تقرير الكاشير يكفي، من تبويب «المبيعات»). بدون مبيعات، مؤشر السرقة الوحيد هو «اشتباه إخفاء».</p>
    <div class="tw"><table><tr><th>الرف</th><th>القسم</th><th>التقاطات</th><th>تعبئة</th><th>مبيعات مسجّلة</th><th>التقاطات بلا بيع</th><th>اشتباه إخفاء</th></tr>${rows.map(o => `<tr><td>${esc(o.z.name)}</td><td>${esc(o.z.section || '')}</td><td>${o.pk}</td><td>${o.rs}</td><td>${o.sl}</td><td style="${o.sl && o.gap ? 'color:var(--da);font-weight:700' : ''}">${o.sl ? o.gap : '<span class="mut">لا مبيعات مسجّلة</span>'}</td><td>${o.cn}</td></tr>`).join('')}</table></div></div>`;
}
// تنزيل ملف: على الموبايل نستخدم قائمة المشاركة (واتساب، تيليجرام، حفظ في الملفات) لأن كثيراً من التطبيقات تمنع التنزيل بصمت
async function download(name, text, type){
  const blob = new Blob(['\ufeff' + text], { type });
  try{ const f = new File([blob], name, { type }); if(navigator.canShare && navigator.canShare({ files: [f] })){ await navigator.share({ files: [f], title: name }); return; } }
  catch(e){ if(e && e.name === 'AbortError') return; }
  const url = URL.createObjectURL(blob), a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  // إن لم يبدأ التنزيل: رابط واضح يفتح الملف ليُحفظ يدوياً
  openModal(`<h2>حفظ الملف</h2><p class="sm">إذا لم يبدأ التنزيل تلقائياً، اضغط الرابط ثم اختر «مشاركة» أو «حفظ في الملفات».</p><a class="btn pri w" href="${url}" download="${esc(name)}" target="_blank">فتح الملف: ${esc(name)}</a><div style="height:8px"></div><button class="btn w" onclick="closeModal()">إغلاق</button>`);
}
function exportCsv(){
  const rows = [['الوقت', 'العارضة', 'القسم', 'النوع', 'الحالة', 'المعالجة', 'ملاحظة', 'عالجها']].concat(S.events.map(e => { const z = zoneOf(e.zone); return [new Date(e.t_start * 1000).toLocaleString('en-GB'), z.name, z.section || '', KIND[e.kind] || e.kind, (STA[e.status] || [e.status])[0], RES[e.resolution] || '', e.note || '', e.resolved_by || '']; }));
  download('haris-events.csv', rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv;charset=utf-8');
}

    <div class="card"><h3>التنبيهات</h3>
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b class="sm">تكرار صوت التنبيه حتى الاطلاع</b><div class="xs mut">كل 30 ثانية ما دام هناك تنبيه لم يُضغط عليه «تم الاطلاع» في شاشة المراقبة.</div></div><button class="sw ${c.repeatBeep ? 'on' : ''}" id="c_repeatBeep" onclick="this.classList.toggle('on')"></button></div>
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b class="sm">إشعارات الكمبيوتر</b><div class="xs mut">تظهر حتى لو كانت الصفحة خلف نوافذ أخرى.</div></div><button class="sw ${c.notify ? 'on' : ''}" id="c_notify" onclick="this.classList.toggle('on');if(this.classList.contains('on')&&'Notification' in window)Notification.requestPermission()"></button></div>
      <p class="sm mut">تيليجرام: أنشئ بوتاً عبر @BotFather وانسخ التوكن، وأضفه لمجموعة المشرفين، ثم ضع رقم المجموعة (chat_id).</p>
      <div class="f2">${f('tgToken', 'توكن البوت')}${f('tgChat', 'رقم المحادثة (chat_id)')}</div>
      <button class="btn sm" onclick="readSet();tgSend('✅ رسالة اختبار من مِرصاد — '+S.cfg.site).then(ok=>toast(ok?'أُرسلت رسالة الاختبار؛ تحقق من تيليجرام':'تعذّر الإرسال'))">إرسال رسالة اختبار</button></div>
    <div class="card"><h3>نسخ احتياطي</h3><p class="sm mut" style="margin-top:0">البيانات محفوظة في هذا المتصفح على هذا الكمبيوتر. احفظ نسخة من الإعدادات والمناطق، أو انقلها لكمبيوتر آخر.</p>
      <div class="row"><button class="btn sm" onclick="download('haris-settings.json',JSON.stringify({cfg:S.cfg,zones:S.zones},null,2),'application/json')">تصدير الإعدادات والمناطق</button>
      <label class="btn sm">استيراد<input type="file" accept=".json" style="display:none" onchange="importSettings(this.files[0])"></label>
      <button class="btn sm dan" onclick="confirmBox('حذف كل الأحداث والمبيعات المسجّلة؟',()=>{S.events=[];S.sales=[];DB.clear('events');DB.clear('sales');render()})">مسح السجلات</button></div></div>
    <button class="btn pri w big" onclick="readSet();saveCfg();toast('تم الحفظ');render()">حفظ الإعدادات</button><div style="height:20px"></div>`;
}
function readSet(){ const g = k => $('#c_' + k) ? $('#c_' + k).value.trim() : S.cfg[k];
  Object.assign(S.cfg, { site: g('site'), open: g('open'), close: g('close'), grace: Math.max(1, +g('grace') || 20), cleaning: Math.max(1, +g('cleaning') || 15), saleWin: Math.max(1, +g('saleWin') || 30),
    poll: Math.max(2, +g('poll') || 10), pin: g('pin'), tgToken: g('tgToken'), tgChat: g('tgChat'), night: $('#c_night') ? $('#c_night').classList.contains('on') : S.cfg.night, notify: $('#c_notify') ? $('#c_notify').classList.contains('on') : S.cfg.notify, ai: $('#c_ai') ? $('#c_ai').classList.contains('on') : S.cfg.ai, conceal: $('#c_conceal') ? $('#c_conceal').classList.contains('on') : S.cfg.conceal, noSales: $('#c_noSales') ? $('#c_noSales').classList.contains('on') : S.cfg.noSales, repeatBeep: $('#c_repeatBeep') ? $('#c_repeatBeep').classList.contains('on') : S.cfg.repeatBeep, judge: $('#c_judge') ? $('#c_judge').classList.contains('on') : S.cfg.judge, judgeModel: $('#c_judgeModel') ? $('#c_judgeModel').value : S.cfg.judgeModel, judgeUrl: g('judgeUrl'), judgeKey: g('judgeKey'), judgeMax: Math.max(1, +g('judgeMax') || 400) }); if(S.cfg.ai && S.running && !isDemo()){ loadMP(); loadPose(); } }
async function importSettings(f){ try{ const j = JSON.parse(await f.text()); if(j.cfg) S.cfg = Object.assign({}, DEF, j.cfg); if(Array.isArray(j.zones)) S.zones = j.zones; saveCfg(); saveZones(); toast('تم الاستيراد'); render(); }catch(e){ toast('ملف غير صالح'); } }

/* =================== التشغيل =================== */
document.addEventListener('touchstart', () => { if(S.src === 'camera') S.touchAt = now(); }, { passive: true, capture: true });
window.addEventListener('beforeunload', e => { if(S.running && !isDemo()){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => { if(S.tab === 'zones') drawEd(); });
setInterval(() => { header(); if(S.tab === 'mon') updMon();
  // تكرار صوت التنبيه كل 30 ثانية حتى يضغط أحد «تم الاطلاع» أو يعالج التنبيه
  tlTick();
  if(S.running && S.cfg.repeatBeep && now() - (S.beepAt || 0) >= 30 && S.events.some(e => e.status === 'incident' && !e.ack && onScreen(e))){ beep(); S.beepAt = now(); }
}, 1000);
(async () => {
  await DB.open();
  S.events = (await DB.all('events')).sort((a, b) => b.t_start - a.t_start);
  S.sales = (await DB.all('sales')).sort((a, b) => b.t - a.t);
  if(!window.isSecureContext) toast('افتح الملف مباشرة من الكمبيوتر بمتصفح Chrome أو Edge', 6000);
  render();
})();
</script>
</body>
</html>
