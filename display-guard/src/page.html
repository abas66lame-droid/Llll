<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>حارس العارضات</title>
<style>
:root{--bg:#f3f5f8;--card:#fff;--line:#e2e7ee;--line2:#eef1f5;--tx:#16202c;--mut:#6a7686;--nav:#0f2742;--pri:#0e6f7a;--pril:#e3f2f3;
--ok:#1a7f4b;--okl:#e6f4ec;--wa:#a86412;--wal:#fdf2e2;--da:#b42f2f;--dal:#fbeaea;--inf:#2d5bb5;--infl:#e8eefa;--r:12px}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--tx);font-family:Tahoma,'Segoe UI','IBM Plex Sans Arabic',system-ui,sans-serif;font-size:14.5px;line-height:1.6}
body{padding-bottom:78px}
button{font-family:inherit;font-size:inherit;color:inherit;border:0;cursor:pointer;background:none}
input,select,textarea{font-family:inherit;font-size:15px;color:var(--tx);background:#fff;border:1px solid var(--line);border-radius:9px;padding:9px 11px;width:100%;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pri)}
.wrap{max-width:1180px;margin:0 auto;padding:0 14px}
header{background:var(--nav);color:#fff;position:sticky;top:0;z-index:20}
header .wrap{display:flex;align-items:center;gap:10px;min-height:56px;flex-wrap:wrap}
header b{font-size:16px}header small{display:block;font-size:11.5px;opacity:.75;margin-top:-3px}
.badge{font-size:11.5px;padding:3px 9px;border-radius:20px;background:#ffffff1f;white-space:nowrap}.badge.red{background:#c53030}.badge.amber{background:#b7791f}.badge.green{background:#1a7f4b}
.sp{flex:1}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;margin:12px 0}.card h3{margin:0 0 10px;font-size:15px}
h2{font-size:18px;margin:16px 0 6px}
.mut{color:var(--mut)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:8px 13px;border-radius:9px;font-weight:600;background:#fff;border:1px solid var(--line);white-space:nowrap}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}.btn.dan{color:var(--da);border-color:#e8bcbc}.btn.ok{color:var(--ok);border-color:#b9dcc8}
.btn.big{padding:12px 16px;font-size:15px}.btn.sm{padding:5px 9px;font-size:12.5px}.btn.w{width:100%}.btn:disabled{opacity:.5}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin-top:12px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--r);padding:11px 12px}.kpi .v{font-size:23px;font-weight:700}.kpi .l{font-size:12px;color:var(--mut)}
.live{position:relative;background:#111;border-radius:var(--r);overflow:hidden;border:1px solid var(--line)}
.live video,.live canvas.v{width:100%;display:block}
.live svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:20px;padding:3px 4px 3px 10px;font-size:12.5px;background:#fff}
.chip.p{border-color:#e9c98e;background:var(--wal)}.chip.i{border-color:#e8b4b4;background:var(--dal)}.chip.c{border-color:#b9c9ec;background:var(--infl)}
.tag{font-size:11.5px;font-weight:600;padding:2px 8px;border-radius:6px;white-space:nowrap}
.t-ok{background:var(--okl);color:var(--ok)}.t-wa{background:var(--wal);color:var(--wa)}.t-da{background:var(--dal);color:var(--da)}.t-inf{background:var(--infl);color:var(--inf)}.t-mut{background:#eef1f5;color:var(--mut)}
.seg{display:flex;background:#e9edf2;border-radius:10px;padding:3px;gap:3px;overflow-x:auto;margin:8px 0}
.seg button{flex:1;padding:7px 10px;border-radius:8px;font-weight:600;font-size:13px;color:var(--mut);white-space:nowrap}.seg button.on{background:#fff;color:var(--tx)}
.ev{display:grid;grid-template-columns:1fr;gap:10px}@media(min-width:760px){.ev{grid-template-columns:300px 1fr}}
.ev img{width:100%;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;display:block}
.pics{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin-top:6px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;z-index:30;background:#fff;border-top:1px solid var(--line);padding:4px 4px calc(6px + env(safe-area-inset-bottom))}
nav.tabs .in{max-width:900px;margin:0 auto;display:flex}
nav.tabs button{flex:1;display:flex;flex-direction:column;align-items:center;font-size:11.5px;color:var(--mut);padding:5px 0;position:relative}
nav.tabs button b{font-size:19px;line-height:1.3;font-weight:400}nav.tabs button.on{color:var(--pri);font-weight:700}
nav.tabs .cnt{position:absolute;top:0;left:calc(50% - 22px);background:var(--da);color:#fff;border-radius:10px;font-size:10.5px;padding:0 6px;font-weight:700}
.modal-bg{position:fixed;inset:0;background:#0b1520a6;z-index:50;display:flex;align-items:center;justify-content:center;padding:14px}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:92vh;overflow:auto;padding:18px}.modal.wide{max-width:1000px}.modal h2{margin:0 0 12px;font-size:17px}
.fld{margin:9px 0}.fld label{display:block;font-size:12.5px;color:var(--mut);margin-bottom:3px;font-weight:600}
.f2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toast{position:fixed;top:66px;left:50%;transform:translateX(-50%);z-index:80;background:var(--nav);color:#fff;padding:9px 16px;border-radius:10px;font-size:13.5px;max-width:90vw;text-align:center}
.note{background:var(--infl);border:1px solid #cbd8f2;border-radius:10px;padding:10px 12px;font-size:13px}.note.wa{background:var(--wal);border-color:#f0d6ad}.note.da{background:var(--dal);border-color:#e8b4b4}
.note ol,.note ul{margin:6px 0 0;padding-inline-start:20px}
table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:7px 6px;border-bottom:1px solid var(--line2);text-align:right;white-space:nowrap}th{color:var(--mut);font-weight:600;background:#f8fafc}
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:#fff}
.bar{height:8px;background:var(--line2);border-radius:6px;overflow:hidden;display:flex}.bar i{display:block;height:100%}
.editor{position:relative;background:#111;border-radius:10px;overflow:hidden;touch-action:none;user-select:none}
.editor canvas{width:100%;display:block}.editor canvas.ov{position:absolute;inset:0;height:100%}
.empty{text-align:center;color:var(--mut);padding:24px}
.sw{width:42px;height:24px;border-radius:20px;background:#cfd6df;position:relative;flex:none}.sw.on{background:var(--pri)}
.sw::after{content:'';position:absolute;top:3px;right:3px;width:18px;height:18px;border-radius:50%;background:#fff;transition:.2s}.sw.on::after{right:21px}
.li{display:flex;align-items:center;gap:10px;padding:9px 0;border-bottom:1px solid var(--line2)}.li:last-child{border:0}
.src{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px}
.src button{text-align:right;border:1px solid var(--line);border-radius:12px;padding:14px;background:#fff}
.src button b{display:block;font-size:15px;margin-bottom:4px}.src button.on{border-color:var(--pri);background:var(--pril)}
</style>
</head>
<body>
<header><div class="wrap" id="hdr"></div></header>
<main class="wrap" id="view"></main>
<nav class="tabs"><div class="in" id="nav"></div></nav>
<div id="modal"></div>
<video id="vid" autoplay muted playsinline style="display:none"></video>
<script>
"use strict";
/*__DETECTOR__*/
/* =================== أدوات =================== */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const rid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const now = () => Date.now() / 1000;
const LS = { get(k, d){ try{ const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); }catch(e){ return d; } }, set(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} } };
function toast(m, ms = 3000){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), ms); }
const tm = ts => ts ? new Date(ts * 1000).toLocaleString('ar-IQ', { hour: '2-digit', minute: '2-digit', day: 'numeric', month: 'numeric' }) : '—';
function ago(ts){ if(!ts) return '—'; const s = Math.round(now() - ts); if(s < 60) return 'منذ ' + s + ' ث'; const m = Math.round(s / 60); if(m < 60) return 'منذ ' + m + ' د'; const h = Math.round(m / 60); return h < 24 ? 'منذ ' + h + ' س' : 'منذ ' + Math.round(h / 24) + ' يوم'; }
function openModal(h, wide){ $('#modal').innerHTML = `<div class="modal-bg" onclick="if(event.target===this)closeModal()"><div class="modal ${wide ? 'wide' : ''}">${h}</div></div>`; }
function closeModal(){ $('#modal').innerHTML = ''; }
function confirmBox(msg, fn){ window._cf = fn; openModal(`<h2>تأكيد</h2><p>${msg}</p><div class="f2"><button class="btn dan" onclick="closeModal();window._cf()">تأكيد</button><button class="btn" onclick="closeModal()">إلغاء</button></div>`); }
let AC = null;
function beep(){ try{ AC = AC || new (window.AudioContext || window.webkitAudioContext)(); [880, 660, 880].forEach((f, i) => { const o = AC.createOscillator(), g = AC.createGain(), t = AC.currentTime + i * .18; o.frequency.value = f; g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.25, t + .02); g.gain.exponentialRampToValueAtTime(.0001, t + .16); o.connect(g).connect(AC.destination); o.start(t); o.stop(t + .17); }); }catch(e){} }

/* =================== التخزين (IndexedDB للأحداث والمبيعات، والباقي محلياً) =================== */
const DB = {
  db: null,
  open(){ return new Promise(res => { try{ const r = indexedDB.open('haris_html', 1);
    r.onupgradeneeded = () => { const d = r.result; if(!d.objectStoreNames.contains('events')) d.createObjectStore('events', { keyPath: 'id' }); if(!d.objectStoreNames.contains('sales')) d.createObjectStore('sales', { keyPath: 'id' }); };
    r.onsuccess = () => { this.db = r.result; res(true); }; r.onerror = () => res(false); }catch(e){ res(false); } }); },
  all(st){ return new Promise(res => { if(!this.db) return res([]); const r = this.db.transaction(st).objectStore(st).getAll(); r.onsuccess = () => res(r.result || []); r.onerror = () => res([]); }); },
  put(st, v){ if(!this.db) return; try{ this.db.transaction(st, 'readwrite').objectStore(st).put(v); }catch(e){} },
  del(st, id){ if(!this.db) return; try{ this.db.transaction(st, 'readwrite').objectStore(st).delete(id); }catch(e){} },
  clear(st){ if(!this.db) return; try{ this.db.transaction(st, 'readwrite').objectStore(st).clear(); }catch(e){} }
};
const DEF = { site: 'الفرع الرئيسي', open: '09:00', close: '23:00', night: true, grace: 20, cleaning: 15, saleWin: 30, poll: 10, tgToken: '', tgChat: '', notify: false, pin: '', test: false, testSec: 10, ai: true, fine: false, debug: false };
const S = {
  cfg: Object.assign({}, DEF, LS.get('haris_cfg', {})), zones: LS.get('haris_zones', []), cleaning: LS.get('haris_cleaning', {}),
  events: [], sales: [], tab: 'mon', evf: 'open', src: null, stream: null, running: false, demo: null,
  lastTick: 0, lastMs: 0, frames: 0, moving: {}, diag: {}, camState: 'ok', alertSeq: 0, drawing: null, snap: null, adminOk: false
};
const saveCfg = () => LS.set('haris_cfg', S.cfg), saveZones = () => LS.set('haris_zones', S.zones), saveCleaning = () => LS.set('haris_cleaning', S.cleaning);
const isDemo = () => S.src === 'demo';
const FAST = /[?&]fast/.test(location.search);
const isTest = () => !isDemo() && !!S.cfg.test;
const grace = () => isDemo() ? (FAST ? 0.25 : 0.5) : isTest() ? Math.max(3, +S.cfg.testSec || 10) / 60 : +S.cfg.grace || 20;
const cleanMin = () => isDemo() ? (FAST ? 0.65 : 1.3) : isTest() ? 1 : +S.cfg.cleaning || 15;
const saleWin = () => isDemo() ? 2 : isTest() ? 2 : +S.cfg.saleWin || 30;
const pollSec = () => isDemo() ? 2 : isTest() ? 1 : Math.max(2, +S.cfg.poll || 10);
const fmtGrace = () => { const s = Math.round(grace() * 60); return s < 60 ? s + ' ثانية' : Math.round(s / 60) + ' دقيقة'; };
function isNight(){
  if(!S.cfg.night || isDemo() || isTest()) return false;
  const d = new Date(), cur = d.getHours() * 60 + d.getMinutes(), m = s => { const [h, mm] = String(s || '0:0').split(':'); return (+h) * 60 + (+mm); };
  const o = m(S.cfg.open), c = m(S.cfg.close); if(o === c) return false;
  return !(o < c ? (cur >= o && cur < c) : (cur >= o || cur < c));
}

/* =================== طبقة الذكاء الاصطناعي المحلية (MediaPipe) ===================
   نفس المكتبة والنماذج المستخدمة في ملف «تتبّع بعيني». تعمل داخل المتصفح بدون توكنات.
   - كشف الأيادي والأشخاص: لا نحكم على العارضة وفيها يد أو شخص، ونحتفظ بصورة لحظة التفاعل.
   - كشف الأجسام: تسمية القطعة التي اختفت (موبايل، لابتوب، تلفزيون...). */
const MPV = '0.10.14';
const MP_URL = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MPV}/vision_bundle.mjs`, MP_WASM = `https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@${MPV}/wasm`;
const MP_MODELS = 'https://storage.googleapis.com/mediapipe-models/';
const OBJ_AR = {person:'شخص',bicycle:'دراجة',car:'سيارة',motorcycle:'دراجة نارية',backpack:'حقيبة ظهر',umbrella:'مظلة',handbag:'حقيبة يد',tie:'ربطة عنق',suitcase:'حقيبة سفر','sports ball':'كرة',bottle:'قنينة','wine glass':'كأس',cup:'كوب',fork:'شوكة',knife:'سكين',spoon:'ملعقة',bowl:'صحن',chair:'كرسي',couch:'كنبة','potted plant':'نبتة',bed:'سرير','dining table':'طاولة',tv:'تلفزيون / شاشة',laptop:'لابتوب',mouse:'ماوس',remote:'ريموت',keyboard:'كيبورد','cell phone':'موبايل',microwave:'مايكرويف',oven:'فرن',toaster:'محمصة',sink:'مغسلة',refrigerator:'ثلاجة',book:'كتاب',clock:'ساعة',vase:'مزهرية',scissors:'مقص','teddy bear':'دمية','hair drier':'مجفف شعر',toothbrush:'فرشاة أسنان'};
const MP = { state: 'off', err: '', obj: null, hand: null, ms: 0, boxes: [] };
async function loadMP(){
  if(MP.state === 'loading' || MP.state === 'ready' || !S.cfg.ai) return;
  MP.state = 'loading'; MP.err = ''; refreshSoon();
  const to = (pr, ms) => Promise.race([pr, new Promise((_, rej) => setTimeout(() => rej(new Error('انتهت المهلة')), ms))]);
  try{
    const mp = await to(import(MP_URL), 30000);
    const fs = await to(mp.FilesetResolver.forVisionTasks(MP_WASM), 30000);
    const make = async (Cls, opts) => { let last; for(const delegate of ['GPU', 'CPU']){ try{ return await to(Cls.createFromOptions(fs, Object.assign({}, opts, { baseOptions: Object.assign({}, opts.baseOptions, { delegate }) })), 45000); }catch(e){ last = e; } } throw last; };
    MP.obj = await make(mp.ObjectDetector, { baseOptions: { modelAssetPath: MP_MODELS + 'object_detector/efficientdet_lite0/float16/1/efficientdet_lite0.tflite' }, runningMode: 'IMAGE', scoreThreshold: 0.35, maxResults: 25 });
    try{ MP.hand = await make(mp.GestureRecognizer, { baseOptions: { modelAssetPath: MP_MODELS + 'gesture_recognizer/gesture_recognizer/float16/1/gesture_recognizer.task' }, runningMode: 'IMAGE', numHands: 4, minHandDetectionConfidence: 0.45, minHandPresenceConfidence: 0.45 }); }catch(e){ MP.hand = null; }
    MP.state = 'ready';
  }catch(e){ MP.state = 'error'; MP.err = (e && e.message) || String(e); }
  refreshSoon();
}
// يرجع مربعات الأيادي والأشخاص (نسب 0..1) في الصورة
function mpPeople(c){
  if(MP.state !== 'ready') return [];
  const t0 = performance.now(), out = [], W = c.width, H = c.height;
  try{
    const r = MP.obj.detect(c);
    for(const d of r.detections || []){ const k = d.categories && d.categories[0], b = d.boundingBox; if(!k || !b || k.categoryName !== 'person') continue;
      out.push({ kind: 'شخص', x: b.originX / W, y: b.originY / H, w: b.width / W, h: b.height / H }); }
  }catch(e){}
  if(MP.hand){
    try{
      const r = MP.hand.recognize ? MP.hand.recognize(c) : MP.hand.detect(c);
      for(const lm of r.landmarks || []){ let l = 1, t = 1, rr = 0, b = 0; for(const q of lm){ l = Math.min(l, q.x); t = Math.min(t, q.y); rr = Math.max(rr, q.x); b = Math.max(b, q.y); }
        const px = (rr - l) * 0.35 + 0.01, py = (b - t) * 0.35 + 0.01; out.push({ kind: 'يد', x: Math.max(0, l - px), y: Math.max(0, t - py), w: Math.min(1, rr - l + 2 * px), h: Math.min(1, b - t + 2 * py) }); }
    }catch(e){}
  }
  MP.ms = Math.round(performance.now() - t0); MP.boxes = out;
  return out;
}
// تسمية القطعة: نبحث في الصورة "قبل" عن جسم معروف داخل مكان النقص
function mpName(src, box){
  if(MP.state !== 'ready') return '';
  try{
    const W = src.width, H = src.height, r = MP.obj.detect(src); let best = null, bs = 0;
    for(const d of r.detections || []){ const k = d.categories && d.categories[0], b = d.boundingBox; if(!k || !b || k.categoryName === 'person') continue;
      const db = { x: b.originX / W, y: b.originY / H, w: b.width / W, h: b.height / H }, ov = DET.overlap(db, box) * k.score;
      if(ov > bs){ bs = ov; best = k.categoryName; } }
    return bs > 0.2 ? (OBJ_AR[best] || best) : '';
  }catch(e){ return ''; }
}

/* =================== مصادر الفيديو =================== */
const AW = 960;
const frameCv = document.createElement('canvas');
async function startScreen(){
  try{
    const st = await navigator.mediaDevices.getDisplayMedia({ video: { frameRate: 5 }, audio: false });
    useStream(st, 'screen');
  }catch(e){ toast('لم تتم مشاركة الشاشة: ' + (e.message || e)); }
}
async function startCamera(deviceId, facing){
  if(!window.isSecureContext || !navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){ toast('الكاميرا تحتاج فتح الصفحة من رابط HTTPS (على الموبايل) أو من ملف على الكمبيوتر.', 7000); return; }
  try{
    const v = deviceId ? { deviceId: { exact: deviceId }, width: { ideal: 1920 }, height: { ideal: 1080 } } : facing ? { facingMode: { ideal: facing }, width: { ideal: 1280 }, height: { ideal: 720 } } : { width: { ideal: 1920 }, height: { ideal: 1080 } };
    const st = await navigator.mediaDevices.getUserMedia({ video: v, audio: false });
    useStream(st, 'camera');
  }catch(e){ toast('تعذّر فتح الكاميرا: ' + (e.message || e)); }
}
function clearDemo(){
  if(S.zones.some(z => z.demo)){ S.zones = S.zones.filter(z => !z.demo); saveZones(); }
  S.events.filter(e => e.demo).forEach(e => DB.del('events', e.id)); S.events = S.events.filter(e => !e.demo);
  S.sales.filter(s => s.demo).forEach(s => DB.del('sales', s.id)); S.sales = S.sales.filter(s => !s.demo);
}
function useStream(st, kind){
  stopSource(true); clearDemo(); S.snap = null;
  S.stream = st; S.src = kind; S.demo = null;
  const v = $('#vid'); v.srcObject = st; v.play().catch(() => {});
  st.getVideoTracks()[0].addEventListener('ended', () => { if(S.stream === st){ stopSource(); sourceLost(); } });
  // تثبيت التركيز بعد ما تستقر الكاميرا، حتى لا «يتنفس» العدسة وتتغير الصورة (يعمل على الأجهزة التي تدعمه)
  setTimeout(() => { try{ const tr = st.getVideoTracks()[0], cap = tr.getCapabilities ? tr.getCapabilities() : {};
    if(cap.focusMode && cap.focusMode.includes('manual')) tr.applyConstraints({ advanced: [{ focusMode: 'manual' }] }).then(() => { S.focusLocked = true; }).catch(() => {});
    else if(cap.focusMode && cap.focusMode.includes('single-shot')) tr.applyConstraints({ advanced: [{ focusMode: 'single-shot' }] }).then(() => { S.focusLocked = true; }).catch(() => {}); }catch(e){} }, 3000);
  startLoop(); loadMP(); render();
}
function startDemo(){ stopSource(true); S.snap = null; S.src = 'demo'; S.demo = new DemoSource(); S.demo.ensureZones(); startLoop(); render(); }
function stopSource(silent){
  if(S.stream){ S.stream.getTracks().forEach(t => t.stop()); S.stream = null; }
  S.src = null; S.demo = null; S.running = false; ENG.reset();
  if(!silent) render();
}
function sourceLost(){
  beep(); toast('⚠️ انقطعت الكاميرا؛ المراقبة متوقفة', 6000);
  notifyAll('⚠️ توقفت المراقبة في ' + S.cfg.site + ': انقطعت الكاميرا (فُصلت أو أُغلقت أو أُطفئ الجهاز).');
}
function grabFrame(){
  let src, w, h;
  if(isDemo()){ src = S.demo.render(); w = src.width; h = src.height; }
  else { const v = $('#vid'); if(!v.videoWidth) return null; src = v; w = v.videoWidth; h = v.videoHeight; }

const ENG = {
  base: null, prev: null, baseCv: null, zst: {},
  camMove: 0, camBump: 0, settle: 0,
  reset(){ this.base = null; this.prev = null; this.baseCv = null; this.zst = {}; this.camMove = 0; this.camBump = 0; this.settle = 0; S.moving = {}; S.diag = {}; S.camState = 'ok'; },
  rebaseAll(F, c){ this.base = DET.clone(F); this.baseCv.getContext('2d').drawImage(c, 0, 0); this.zst = {}; },
  // قبل إعادة ضبط المرجع كاملاً (بعد حركة الكاميرا): نقارن كل عارضة بالمرجع القديم بعد محاذاته بالإزاحة المقاسة،
  // حتى لا تُخفى سرقة حدثت مع حركة الموبايل (دفعه وأخذ القطعة في نفس اللحظة). نفتح فقط حالات «نقص» واضحة، ونغلق ما رجع.
  realign(F, c, sh, ppl, night){
    let n = 0;
    const grow = (b, m) => ({ x: b.x - b.w * m, y: b.y - b.h * m, w: b.w * (1 + 2 * m), h: b.h * (1 + 2 * m) });
    // نطابق المرجع القديم على الصورة الحالية (إزاحة + دوران + تقريب). إذا تعذّر القياس بثقة لا نفتح حالات (تفادياً للإنذار الكاذب)
    const T = DET.estimateAffine(this.base, F, sh);
    if(!T){ this.rebaseAll(F, c); return 0; }
    const wc = document.createElement('canvas'); wc.width = c.width; wc.height = c.height;
    const wx = wc.getContext('2d', { willReadFrequently: true }); wx.drawImage(c, 0, 0); wx.setTransform(T.a, T.b, T.c, T.d, T.e, T.f); wx.drawImage(this.baseCv, 0, 0); wx.setTransform(1, 0, 0, 1, 0, 0);
    const B = DET.frameFromCanvas(wc);
    for(const z of S.zones){
      const r = DET.compareZone(B, F, z, [0, 0], { fine: !!S.cfg.fine });
      if(r.changed > 0.5) continue; // تغيّر شامل للعارضة بعد الحركة: لا نستطيع الحكم بثقة
      const opened = S.events.filter(e => e.zone === z.id && (e.status === 'pending' || e.status === 'incident'));
      for(const reg of mergeNear(r.regions, 0.04)){
        if((ppl || []).some(b => ix(grow(b, 0.08), grow(reg, 0.1)))) continue;
        if(reg.type === 'rem'){ if(!opened.some(e => DET.overlap(reg, e.box) > 0.5)){ this.newRemoval(z, reg, c, night); n++; } }
        else opened.filter(e => DET.overlap(reg, e.box) > 0.35).forEach(e => this.returned(e, c));
      }
    }
    this.rebaseAll(F, c);
    return n;
  },
  process(c, ppl){
    ppl = ppl || [];

      this.base = DET.clone(F); this.prev = F; this.baseCv = document.createElement('canvas'); this.baseCv.width = c.width; this.baseCv.height = c.height; this.baseCv.getContext('2d').drawImage(c, 0, 0); return;
    }
    const sh = DET.estimateShift(this.base, F), night = isNight(), FULL = { x: 0, y: 0, w: 1, h: 1 };
    // 0) لمس الشاشة يحرّك الموبايل: نوقف الحكم حتى يثبت، ثم نعيد الضبط تلقائياً

    // 1) هل الكاميرا نفسها تتحرك الآن؟
    const gm = DET.motion(this.prev, F, FULL)[0];

    this.camMove = 0;
    // 2) بعد اللمس أو الاهتزاز: ننتظر قراءتين مستقرتين ثم نعتمد الصورة الحالية مرجعاً (إذا تغيّرت الصورة عموماً)
    if(this.settle > 0){
      S.camState = 'settle'; S.zones.forEach(z => S.diag[z.id] = { state: 'settle' });
      if(gm < 0.03 && --this.settle === 0){ const gb = DET.motion(this.base, F, FULL)[0]; if(gb > 0.04){ const n = this.realign(F, c, sh, ppl, night); toast(n ? 'تحرك الموبايل؛ أُعيد ضبط الصورة، ورُصد نقص في ' + n + ' موضع' : 'تحرك الموبايل؛ أُعيد ضبط الصورة تلقائياً', 3500); } S.camState = 'ok'; }
      this.prev = F; return;
    }
    S.camState = 'ok';
    // 3) انزياح الكاميرا بدون لمس: الصورة كلها اختلفت عن المرجع مع إزاحة واضحة (الشيل يغيّر جزءاً صغيراً فقط)
    const gBase = DET.motion(this.base, F, FULL)[0], moved = Math.abs(sh[0]) >= 4 || Math.abs(sh[1]) >= 4;
    if(gBase > 0.22 && (moved || gBase > 0.6) && gm < 0.03 && !ppl.length){
      S.camState = 'bumped'; S.zones.forEach(z => S.diag[z.id] = { state: 'camera' });
      if(++this.camBump >= 2){ const n = this.realign(F, c, sh, ppl, night); this.camBump = 0; S.camState = 'ok'; toast(n ? 'انزاحت الكاميرا؛ أُعيد ضبط الصورة، ورُصد نقص في ' + n + ' موضع' : 'انزاحت الكاميرا قليلاً؛ أُعيد ضبط الصورة تلقائياً بدون احتسابها شيلاً', 4000); }

    }
    this.camBump = 0;

      const ez = { x: Math.max(0, z.x - 0.04), y: Math.max(0, z.y - 0.04) }; ez.w = Math.min(1 - ez.x, z.w + 0.08); ez.h = Math.min(1 - ez.y, z.h + 0.08);
      const [frac, cnt] = DET.motion(this.prev, F, ez);

      const hands = ppl.filter(b => b.kind === 'يد' && ix(b, ez)), persons = ppl.filter(b => b.kind === 'شخص' && coverage(b, z) > 0.35);
      if(!hands.length && persons.length && frac < 0.01 && cnt < 3){ zs.still = (zs.still || 0) + 1; } else zs.still = 0;

        // يد أو شخص داخل العارضة: نحتفظ بصورة اللحظة ونعدّ التفاعل، ولا نحكم الآن

      }
      zs.busy = false;

      S.moving[z.id] = false;

      if(r.changed > 0.5){
        // تغيّر كبير في المنطقة (قطعة تملأ أغلب المربع، أو حجب): ننتظر 3 قراءات مستقرة ثم نعامله كالمعتاد

      const grow = (b, m) => ({ x: b.x - b.w * m, y: b.y - b.h * m, w: b.w * (1 + 2 * m), h: b.h * (1 + 2 * m) });
      if(ppl.length && r.regions.some(reg => ppl.some(b => ix(grow(b, 0.08), grow(reg, 0.1))))){ S.diag[z.id] = { state: 'person', r }; S.moving[z.id] = true; continue; }

    if(moved && gm < 0.03 && !ppl.length && S.zones.every(z => { const d = S.diag[z.id]; return d && d.state === 'ok' && d.r && !d.r.regions.length; })) this.rebaseAll(F, c);

  rebase(z, F, c){ const [x, y, w, h] = DET.rebase(this.base, F, z); if(w > 0 && h > 0) this.baseCv.getContext('2d').drawImage(c, x, y, w, h, x, y, w, h); },
  shot(src, box, color, W = 560){

function addEvent(e){ if(isDemo()) e.demo = true; S.events.unshift(e); DB.put('events', e); if(S.events.length > 3000){ const old = S.events.pop(); DB.del('events', old.id); } refreshSoon(); }
function putEvent(e){ DB.put('events', e); refreshSoon(); }
function trySale(e){
  const w = saleWin() * 60, s = S.sales.filter(s => s.zone === e.zone && s.remaining > 0 && s.t >= e.t_start - w).sort((a, b) => a.t - b.t)[0];
  if(!s) return false;
  s.remaining--; DB.put('sales', s);
  e.status = 'sold'; e.t_end = now(); e.sale = s.id; putEvent(e); return true;
}
function addSale(zid, qty, ref, source){
  qty = Math.max(1, Math.min(100, parseInt(qty) || 1));
  const s = { id: rid(), zone: zid, qty, remaining: qty, t: now(), ref: ref || '', source: source || 'يدوي', demo: isDemo() };
  const late = now() - 24 * 3600;
  const evs = S.events.filter(e => e.zone === zid && (e.kind === 'removal') && (e.status === 'pending' || (e.status === 'incident' && e.t_start >= late))).sort((a, b) => a.t_start - b.t_start);
  for(const e of evs.slice(0, qty)){ if(e.status === 'incident') e.note = ((e.note || '') + ' بيع متأخر بعد التنبيه').trim(); e.status = 'sold'; e.t_end = now(); e.sale = s.id; putEvent(e); s.remaining--; }
  S.sales.unshift(s); DB.put('sales', s); refreshSoon();
}
function startCleaning(zid, minutes){
  const end = now() + (+minutes || cleanMin()) * 60;
  S.cleaning[zid] = Math.max(S.cleaning[zid] || 0, end); saveCleaning();
  S.events.filter(e => e.zone === zid && e.status === 'pending').forEach(e => { e.deadline = Math.max(e.deadline, end + 60); putEvent(e); });
  refreshSoon();
}
function resolveEv(id, res, note, who){
  const e = S.events.find(e => e.id === id); if(!e) return;
  e.status = 'resolved'; e.resolution = res; e.resolved_by = who || ''; e.t_resolved = now(); if(note) e.note = ((e.note || '') + ' ' + note).trim();
  putEvent(e);
}
// دمج مناطق النقص المتقاربة في نفس اللحظة (قطعة واحدة قد تظهر كجزأين)
function mergeNear(regs, g){
  const out = regs.map(r => Object.assign({}, r));
  for(let ch = true; ch;){ ch = false;
    for(let i = 0; i < out.length && !ch; i++) for(let j = i + 1; j < out.length && !ch; j++){
      const A = out[i], B = out[j]; if(A.type !== B.type) continue;
      if(A.x <= B.x + B.w + g && B.x <= A.x + A.w + g && A.y <= B.y + B.h + g && B.y <= A.y + A.h + g){
        const x = Math.min(A.x, B.x), y = Math.min(A.y, B.y); out[i] = { type: A.type, cells: A.cells + B.cells, x, y, w: Math.max(A.x + A.w, B.x + B.w) - x, h: Math.max(A.y + A.h, B.y + B.h) - y }; out.splice(j, 1); ch = true; } } }
  return out;
}
function coverage(b, z){ const w = Math.max(0, Math.min(b.x + b.w, z.x + z.w) - Math.max(b.x, z.x)), h = Math.max(0, Math.min(b.y + b.h, z.y + z.h) - Math.max(b.y, z.y)); return w * h / Math.max(1e-9, z.w * z.h); }
function ix(a, b){ return Math.min(a.x + a.w, b.x + b.w) > Math.max(a.x, b.x) && Math.min(a.y + a.h, b.y + b.h) > Math.max(a.y, b.y); }
function countInteraction(zid){ const d = new Date().toLocaleDateString('en-CA'), all = LS.get('haris_inter', {}); all[d] = all[d] || {}; all[d][zid] = (all[d][zid] || 0) + 1;
  const keys = Object.keys(all).sort(); while(keys.length > 60) delete all[keys.shift()]; LS.set('haris_inter', all); }
const interToday = zid => ((LS.get('haris_inter', {})[new Date().toLocaleDateString('en-CA')] || {})[zid] || 0);
const zoneOf = id => S.zones.find(z => z.id === id) || { name: 'منطقة محذوفة', section: '' };
function alertEv(e){
  S.alertSeq++; beep();

function notifyAll(text, img){

async function tgSend(text, dataUrl){

class DemoSource {
  constructor(){
    this.W = 1280; this.H = 720; this.present = new Array(12).fill(true); this.person = null; this.t0 = performance.now() / 1000; this.done = new Set(); this.cycle = 0;
    this.slots = []; for(let r = 0; r < 2; r++) for(let c = 0; c < 6; c++) this.slots.push([70 + c * 200, 70 + r * 320]);
    this.cols = ['#19191e', '#be282d', '#285aaf', '#ebebeb', '#378c50', '#a07d28', '#782d8c', '#d2781e', '#464650', '#1e788c', '#c83c78', '#64963c'];

  ensureZones(){
    if(this.zonesReady) return; this.zonesReady = true;
    if(S.zones.some(z => z.demo)) return;
    const W = this.W, H = this.H;
    [['رف علوي - يمين', 'الهواتف', 40, 50], ['رف علوي - يسار', 'الهواتف', 640, 50], ['رف سفلي - يمين', 'الحاسبات', 40, 370], ['رف سفلي - يسار', 'الحاسبات', 640, 370]]
      .forEach(([n, s, x, y]) => S.zones.push({ id: rid(), name: n, section: s, x: x / W, y: y / H, w: 600 / W, h: 270 / H, demo: true }));
    saveZones();
  }
  zoneIdx(i){ const [x, y] = this.slots[i]; return (x < 640 ? 0 : 1) + (y < 300 ? 0 : 2); }

  step(){
    const g = grace() * 60, t = performance.now() / 1000 - this.t0, L = 10 * g + 40;
    if(t > L){ this.t0 += L; this.cycle++; this.done = new Set(); this.present.fill(true); return this.step(); }
    const a = (this.cycle * 5) % 12, b = (a + 3) % 12, cc = (a + 7) % 12, d1 = (a + 1) % 12, d2 = (a + 8) % 12;
    const plan = [[5, 'pin'], [9, 'pout'], [12, 'rm', a], [12 + .5 * g, 'ret', a], [2 * g, 'rm', b], [2 * g + 6, 'sale', b],
      [3.5 * g, 'clean', d1], [3.5 * g + 3, 'rm', d1], [3.5 * g + 4, 'rm', d2], [5 * g, 'ret', d1], [5.1 * g, 'ret', d2],
      [6.5 * g, 'rm', cc], [8.5 * g, 'ret', cc], [8.5 * g + 6, 'ret', b]];
    plan.forEach(([at, act, k], i) => {
      if(t < at || this.done.has(i)) return; this.done.add(i);
      if(act === 'pin') this.person = 900; else if(act === 'pout') this.person = null;
      else if(act === 'rm') this.present[k] = false; else if(act === 'ret') this.present[k] = true;
      else if(act === 'sale'){ const z = this.zoneId(k); if(z) addSale(z, 1, 'محاكاة كاشير', 'تجريبي'); }
      else if(act === 'clean'){ [d1, d2].forEach(i => { const z = this.zoneId(i); if(z) startCleaning(z, cleanMin()); }); }
    });

  render(){

      x.beginPath(); x.roundRect ? x.roundRect(px, py, 150, 230, 16) : x.rect(px, py, 150, 230); x.fill(); x.stroke();

    });

}

function report(days = 14){

  for(let i = days - 1; i >= 0; i--){
    const a = today.getTime() / 1000 - i * 86400, b = a + 86400, R = S.events.filter(e => (e.kind === 'removal' || e.kind === 'night') && e.t_start >= a && e.t_start < b);
    out.push({ day: new Date(a * 1000).toLocaleDateString('en-CA'), removals: R.length, returned: R.filter(e => e.status === 'returned').length, sold: R.filter(e => e.status === 'sold' || e.resolution === 'sold').length,
      incidents: R.filter(e => e.status === 'incident' || e.status === 'resolved').length, theft: R.filter(e => e.resolution === 'theft').length, false: R.filter(e => e.resolution === 'false').length, late: R.filter(e => e.resolution === 'returned').length });
  }
  return out;
}
function vRep(){
  const D = report(), T = D.reduce((a, d) => { for(const k in d) if(k !== 'day') a[k] = (a[k] || 0) + d[k]; return a; }, {});

  S.events.filter(e => (e.kind === 'removal' || e.kind === 'night') && e.t_start >= since).forEach(e => { const o = zm[e.zone] = zm[e.zone] || { total: 0, inc: 0, theft: 0 }; o.total++; if(e.status === 'incident' || e.status === 'resolved') o.inc++; if(e.resolution === 'theft') o.theft++; });
  const Z = Object.entries(zm).sort((a, b) => b[1].inc - a[1].inc || b[1].total - a[1].total);
  return `<h2>التقارير — آخر 14 يوماً</h2><div class="kpis">${[['حالات شيل', T.removals], ['رجعت خلال المهلة', T.returned], ['مُباعة', T.sold], ['تنبيهات', T.incidents], ['رجعت بعد التنبيه', T.late], ['سرقة مؤكدة', T.theft], ['خطأ في الكشف', T.false]].map(([l, n]) => `<div class="kpi"><div class="l">${l}</div><div class="v">${n || 0}</div></div>`).join('')}</div>

      return `<tr><td>${d.day}</td><td>${d.removals}</td><td>${d.returned}</td><td>${d.sold}</td><td>${d.incidents}</td><td>${d.theft}</td><td><div class="bar"><i style="width:${100 * d.returned / t}%;background:#38a169"></i><i style="width:${100 * d.sold / t}%;background:#2d5bb5"></i><i style="width:${100 * d.incidents / t}%;background:#c53030"></i></div></td></tr>`; }).join('')}</table></div>

function download(name, text, type){ const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob(['﻿' + text], { type })); a.download = name; document.body.appendChild(a); a.click(); a.remove(); }
function exportCsv(){
  const rows = [['الوقت', 'العارضة', 'القسم', 'النوع', 'الحالة', 'المعالجة', 'ملاحظة', 'عالجها']].concat(S.events.map(e => { const z = zoneOf(e.zone); return [new Date(e.t_start * 1000).toLocaleString('en-GB'), z.name, z.section || '', KIND[e.kind] || e.kind, (STA[e.status] || [e.status])[0], RES[e.resolution] || '', e.note || '', e.resolved_by || '']; }));
  download('haris-events.csv', rows.map(r => r.map(v => '"' + String(v).replace(/"/g, '""') + '"').join(',')).join('\n'), 'text/csv;charset=utf-8');
}

/* ----- الإعدادات ----- */
function vSet(){
  if(S.cfg.pin && !S.adminOk) return `<div class="card"><h3>الإعدادات محمية</h3><button class="btn pri" onclick="pinGate(render)">إدخال رمز الإدارة</button></div>`;
  const c = S.cfg, f = (k, l, t = 'text', ex = '') => `<div class="fld"><label>${l}</label><input id="c_${k}" type="${t}" value="${esc(c[k])}" ${ex}></div>`;
  return `<h2>الإعدادات</h2>
    <div class="card"><h3>عام</h3>${f('site', 'اسم الفرع')}<div class="f2">${f('open', 'بداية الدوام', 'time')}${f('close', 'نهاية الدوام', 'time')}</div>
      <div class="f2">${f('grace', 'مهلة رجوع المنتج (دقيقة)', 'number', 'min="1"')}${f('cleaning', 'مدة التنظيف/العرض (دقيقة)', 'number', 'min="1"')}</div>
      <div class="f2">${f('saleWin', 'نافذة مطابقة البيع (دقيقة)', 'number')}${f('poll', 'تحليل الصورة كل (ثانية)', 'number', 'min="2"')}</div>
      <div class="row" style="justify-content:space-between;margin:10px 0"><div><b class="sm">التنبيه الفوري خارج ساعات العمل</b><div class="xs mut">أي شيل بعد الإغلاق يُنبَّه عنه مباشرة بدون مهلة.</div></div><button class="sw ${c.night ? 'on' : ''}" id="c_night" onclick="this.classList.toggle('on')"></button></div>
      ${f('pin', 'رمز الإدارة (لحماية الإعدادات ومعالجة التنبيهات؛ اتركه فارغاً لإلغائه)', 'password')}</div>
    <div class="card"><h3>الذكاء الاصطناعي المحلي</h3><div class="row" style="justify-content:space-between"><div><b class="sm">كشف الأيادي والأشخاص وتسمية القطع (MediaPipe)</b>
      <div class="xs mut">يعمل داخل الجهاز بدون توكنات. يحتاج إنترنت أول مرة لتنزيل النماذج (حوالي 10 ميغابايت). يمنع الحكم أثناء وجود يد في العارضة، ويحفظ صورة لحظة الشيل، ويسمّي القطعة (موبايل، لابتوب، تلفزيون...).</div></div>
      <button class="sw ${c.ai ? 'on' : ''}" id="c_ai" onclick="this.classList.toggle('on')"></button></div><div class="xs" style="margin-top:6px">الحالة: ${{ off: 'لم يُحمَّل بعد (يُحمَّل عند تشغيل الكاميرا)', loading: 'جارٍ التحميل…', ready: 'يعمل ✓', error: 'تعذّر التحميل: ' + esc(MP.err) }[MP.state]}</div></div>
    <div class="card"><h3>التنبيهات</h3>
      <div class="row" style="justify-content:space-between;margin-bottom:8px"><div><b class="sm">إشعارات الكمبيوتر</b><div class="xs mut">تظهر حتى لو كانت الصفحة خلف نوافذ أخرى.</div></div><button class="sw ${c.notify ? 'on' : ''}" id="c_notify" onclick="this.classList.toggle('on');if(this.classList.contains('on')&&'Notification' in window)Notification.requestPermission()"></button></div>
      <p class="sm mut">تيليجرام: أنشئ بوتاً عبر @BotFather وانسخ التوكن، وأضفه لمجموعة المشرفين، ثم ضع رقم المجموعة (chat_id).</p>
      <div class="f2">${f('tgToken', 'توكن البوت')}${f('tgChat', 'رقم المحادثة (chat_id)')}</div>
      <button class="btn sm" onclick="readSet();tgSend('✅ رسالة اختبار من حارس العارضات — '+S.cfg.site).then(ok=>toast(ok?'أُرسلت رسالة الاختبار؛ تحقق من تيليجرام':'تعذّر الإرسال'))">إرسال رسالة اختبار</button></div>
    <div class="card"><h3>نسخ احتياطي</h3><p class="sm mut" style="margin-top:0">البيانات محفوظة في هذا المتصفح على هذا الكمبيوتر. احفظ نسخة من الإعدادات والمناطق، أو انقلها لكمبيوتر آخر.</p>
      <div class="row"><button class="btn sm" onclick="download('haris-settings.json',JSON.stringify({cfg:S.cfg,zones:S.zones},null,2),'application/json')">تصدير الإعدادات والمناطق</button>
      <label class="btn sm">استيراد<input type="file" accept=".json" style="display:none" onchange="importSettings(this.files[0])"></label>
      <button class="btn sm dan" onclick="confirmBox('حذف كل الأحداث والمبيعات المسجّلة؟',()=>{S.events=[];S.sales=[];DB.clear('events');DB.clear('sales');render()})">مسح السجلات</button></div></div>
    <button class="btn pri w big" onclick="readSet();saveCfg();toast('تم الحفظ');render()">حفظ الإعدادات</button><div style="height:20px"></div>`;
}
function readSet(){ const g = k => $('#c_' + k) ? $('#c_' + k).value.trim() : S.cfg[k];
  Object.assign(S.cfg, { site: g('site'), open: g('open'), close: g('close'), grace: Math.max(1, +g('grace') || 20), cleaning: Math.max(1, +g('cleaning') || 15), saleWin: Math.max(1, +g('saleWin') || 30),
    poll: Math.max(2, +g('poll') || 10), pin: g('pin'), tgToken: g('tgToken'), tgChat: g('tgChat'), night: $('#c_night') ? $('#c_night').classList.contains('on') : S.cfg.night, notify: $('#c_notify') ? $('#c_notify').classList.contains('on') : S.cfg.notify, ai: $('#c_ai') ? $('#c_ai').classList.contains('on') : S.cfg.ai }); if(S.cfg.ai && S.running && !isDemo()) loadMP(); }
async function importSettings(f){ try{ const j = JSON.parse(await f.text()); if(j.cfg) S.cfg = Object.assign({}, DEF, j.cfg); if(Array.isArray(j.zones)) S.zones = j.zones; saveCfg(); saveZones(); toast('تم الاستيراد'); render(); }catch(e){ toast('ملف غير صالح'); } }

/* =================== التشغيل =================== */
document.addEventListener('touchstart', () => { if(S.src === 'camera') S.touchAt = now(); }, { passive: true, capture: true });
window.addEventListener('beforeunload', e => { if(S.running && !isDemo()){ e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('resize', () => { if(S.tab === 'zones') drawEd(); });
setInterval(() => { header(); if(S.tab === 'mon') updMon(); }, 1000);
(async () => {
  await DB.open();
  S.events = (await DB.all('events')).sort((a, b) => b.t_start - a.t_start);
  S.sales = (await DB.all('sales')).sort((a, b) => b.t - a.t);
  if(!window.isSecureContext) toast('افتح الملف مباشرة من الكمبيوتر بمتصفح Chrome أو Edge', 6000);
  render();
})();
</script>
</body>
